<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和小暖的对话</title>
  <style>
    :root {
      --bg:           #EDEBE6;
      --surface:      #F9F8F6;
      --ai-bg:        #FFFFFF;
      --user-bg:      #2C3748;
      --accent:       #6BAE8A;
      --text-primary: #1A1714;
      --text-secondary:#6B6560;
      --border:       #E2DDD7;
      --header-bg:    #1C1C1E;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
              'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px 48px;
      -webkit-font-smoothing: antialiased;
    }
    .chat-wrap {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    }
    .chat-header {
      background: var(--header-bg);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #6BAE8A 0%, #4A8A6A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
      position: relative;
      letter-spacing: -0.5px;
    }
    .avatar::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #34C759;
      border: 2px solid var(--header-bg);
    }
    .header-name {
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    #chatLog {
      background: var(--surface);
      height: 500px;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #chatLog::-webkit-scrollbar { width: 3px; }
    #chatLog::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .msg-row { display: flex; flex-direction: column; gap: 3px; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.ai   { align-items: flex-start; }
    .msg-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0 3px;
      color: var(--text-secondary);
    }
    .msg-row.ai .msg-label { color: var(--accent); }
    .msg-bubble {
      max-width: 82%;
      padding: 11px 15px;
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: -0.1px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-row.ai .msg-bubble {
      background: var(--ai-bg);
      color: var(--text-primary);
      border-radius: 18px;
      border-top-left-radius: 4px;
      border-left: 3px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bg);
      color: #FFFFFF;
      border-radius: 18px;
      border-top-right-radius: 4px;
    }
    .msg-bubble a { color: var(--accent); text-decoration: underline; }
    .msg-row.user .msg-bubble a { color: #A8D5BB; }
    .typing-row { display: flex; flex-direction: column; gap: 3px; }
    .typing-label {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--accent); padding: 0 3px;
    }
    .typing-bubble {
      background: var(--ai-bg);
      border-radius: 18px; border-top-left-radius: 4px;
      border-left: 3px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 13px 16px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-bubble span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); opacity: 0.4;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%,100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex; gap: 9px; align-items: flex-end;
    }
    #chatInput {
      flex: 1;
      padding: 10px 15px;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      font-size: 15px;
      font-family: var(--font);
      letter-spacing: -0.1px;
      line-height: 1.5;
      resize: none;
      height: 42px; max-height: 120px;
      outline: none;
      background: var(--ai-bg);
      color: var(--text-primary);
      transition: border-color 0.15s;
      -webkit-font-smoothing: antialiased;
    }
    #chatInput::placeholder { color: #B5AFA9; }
    #chatInput:focus { border-color: var(--accent); }
    #chatInput:disabled { opacity: 0.5; }
    #chatSubmit {
      width: 42px; height: 42px;
      border-radius: 11px; border: none;
      background: var(--user-bg); color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #chatSubmit:hover:not(:disabled) { background: #3D4E61; }
    #chatSubmit:active:not(:disabled) { transform: scale(0.94); }
    #chatSubmit:disabled { background: var(--border); cursor: not-allowed; }

    /* Matrix survey widget */
    .matrix-card {
      width: 100%;
      background: var(--ai-bg);
      border-radius: 14px;
      border-left: 3px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-top: 4px;
    }
    .matrix-title {
      background: var(--accent-light, #E8F5EE);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 8px 14px;
    }
    .matrix-table-wrap { overflow-x: auto; padding: 0 4px; }
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .matrix-table th {
      text-align: center;
      padding: 8px 4px 6px;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 12px;
      line-height: 1.4;
      min-width: 36px;
    }
    .matrix-table th:first-child { text-align: left; min-width: 140px; }
    .matrix-table td {
      padding: 6px 4px;
      text-align: center;
      border-top: 1px solid var(--border);
    }
    .matrix-table td:first-child {
      text-align: left;
      padding-left: 14px;
      padding-right: 10px;
      color: var(--text-primary);
      font-size: 13.5px;
      line-height: 1.5;
    }
    .matrix-table tr:hover td { background: #FAFAF8; }
    .matrix-radio {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
      transition: border-color 0.15s, background 0.15s;
    }
    .matrix-radio:hover { border-color: var(--accent); }
    .matrix-radio.checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .matrix-radio.checked::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: white;
    }
    .matrix-footer {
      padding: 10px 14px;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }
    .matrix-submit {
      padding: 9px 22px;
      background: var(--user-bg);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      -webkit-font-smoothing: antialiased;
    }
    .matrix-submit:disabled { opacity: 0.35; cursor: not-allowed; }
    .matrix-submit:not(:disabled):hover { background: #3D4E61; }


    /* Single-item scale widget */
    .scale-widget {
      margin-top: 14px;
      padding: 12px 14px 16px;
      background: var(--surface);
      border-radius: 14px;
      border: 1.5px solid var(--border);
    }
    .scale-hint {
      font-size: 12px;
      color: var(--text-secondary);
      font-style: italic;
      text-align: center;
      margin-bottom: 10px;
    }
    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    .scale-options {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .scale-opt {
      flex: 1;
      aspect-ratio: 1;
      max-width: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--ai-bg);
      color: var(--text-secondary);
      font-size: 15px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.1s;
      min-width: 0;
    }
    .scale-opt:hover:not(:disabled) {
      background: #E8F5EE;
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.1);
    }
    .scale-opt:active:not(:disabled) { transform: scale(0.95); }
    .scale-opt.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .scale-opt:disabled { cursor: default; opacity: 0.55; }
    .scale-opt.selected:disabled { opacity: 1; }

    /* Post-chat pages */
    .eval-body {
      padding: 28px 24px 32px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .eval-intro {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text-primary);
    }
    .eval-q {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .eval-q-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-primary);
      font-weight: 500;
    }
    .standalone-scale {
      padding: 14px 16px 16px;
      background: var(--surface);
      border-radius: 14px;
      border: 1.5px solid var(--border);
    }
    .eval-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    .continue-btn, .submit-btn {
      padding: 12px 28px;
      background: var(--user-bg);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      -webkit-font-smoothing: antialiased;
    }
    .continue-btn:hover, .submit-btn:hover { background: #3D4E61; }
    .continue-btn:disabled, .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .chat-end-btn-wrap {
      text-align: center;
      padding: 24px 0 12px;
    }

    @media (max-width: 500px) {
      body { padding: 0; }
      .chat-wrap { border-radius: 0; box-shadow: none; min-height: 100vh; }
      #chatLog { height: calc(100vh - 126px); }
    }

  </style>
</head>
<body>
<!-- Chat interface -->

<div class="chat-wrap" id="chatWrap">
  <div class="chat-header">
    <div class="avatar">暖</div>
    <div class="header-name">和小暖的对话</div>
  </div>
  <div id="chatLog"></div>
  <div id="matrixSlot" style="display:none; border-top:1px solid var(--border);"></div>
  <div class="input-area">
    <textarea id="chatInput" placeholder="在这里输入你的回复…"></textarea>
    <button id="chatSubmit" aria-label="发送">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<!-- Eval page -->
<div id="evalPage" class="chat-wrap" style="display:none; flex-direction:column;">
  <div class="chat-header">
    <div class="avatar">暖</div>
    <div class="header-name">和小暖的对话</div>
  </div>
  <div class="eval-body" id="evalBody"></div>
  <div class="eval-footer">
    <button class="continue-btn" id="evalContinueBtn" disabled>继续 →</button>
  </div>
</div>

<!-- GAAIS page -->
<div id="gaaisPage" class="chat-wrap" style="display:none; flex-direction:column;">
  <div class="chat-header">
    <div class="avatar">暖</div>
    <div class="header-name">和小暖的对话</div>
  </div>
  <div class="eval-body" id="gaaisBody"></div>
  <div class="eval-footer">
    <button class="submit-btn" id="gaaisSubmitBtn" disabled>提交并前往最后问卷 →</button>
  </div>
</div>

<script>
// Config
const PROXY_URL        = "https://emotion-openai-ynrdrrrkzk.ap-northeast-2.fcapp.run";
const MODEL            = "gpt-4.1-mini";
// Lark credentials are stored server-side in the FC proxy — not here.

const urlParams = new URLSearchParams(window.location.search);
// Read participant ID from URL param (?id=XXXX) passed from Qualtrics
// Falls back to random ID for direct testing
const participantId = urlParams.get('id') || 'anon_' + Math.random().toString(36).substring(2, 8);

// Condition assignment
const CONDITION = Math.random() < 0.5 ? 'emotion' : 'control';
console.log('[Study] ID:', participantId, '| Condition:', CONDITION);

// Hardcoded opening (fixes unpredictable AI opening messages)
const OPENING_MESSAGE =
`你好！我是小暖，一个愿意倾听你心声、听你吐槽的伙伴。请你完全放心，你与小暖的所有对话及你的个人信息都将完全匿名和保密，不会与任何人分享。这里是一个安全、支持性的空间，你可以自由、深入地表达自己的感受和想法，不会受到任何评判。为了更好地理解你，在我们的对话中，请你尽可能详细和真实地描述你的问题，分享你的感受和经历。你说的每一句话都只属于你和小暖。

我了解到很多医护人员在工作中会遇到很多压力和困扰。如果你愿意的话，可以跟我说说最近在工作上有没有什么让你压力很大或困扰的事吗？`;

// System prompts

const SYSTEM_PROMPT_EMOTION = `你是一名心理支持专员，与医护人员进行一对一的情绪支持对话。你的对话应温和、专业、有同理心，没有任何评判。

对话已经开始——你已经说了开场白，并且询问了用户最近工作上是否有压力或困扰。用户会对此作出回应，请从用户的第一条消息开始，按照以下结构继续对话。

**阶段1：事件收集与初步评估**

每次只问一个问题。在Q1、Q2、Q4、Q6回答后，给予一句话简短、自然、有同理心的回应：
- 不涉及情绪相关词汇（如压力、失望、无助、伤心、焦虑、感受等）
- 可以指出他们所处情境的客观难处
- 可以使用"听上去"、"看起来"等推测性语言
❌ 在收到Q3、Q5、Q7-Q11的回答后，不要给任何反馈，直接问下一个问题。

**请严格按以下顺序提问：**

Q1：先判断用户是否实际提到任何工作上的压力、困扰或不舒服的经历。不要把“没有”“最近没有”“想不到有什么”等回答硬套进“举个具体例子”的分支。

- 如果用户明确表示最近没有这样的工作经历，系统会先用一个中性的、范围稍宽的问题询问以前是否有过类似的工作经历。你不要自行追问具体例子。
- 如果用户再次明确表示以前也没有，不要虚构或强迫其提供事件。系统会结束事件相关流程。
- 只有当用户确实提到了某种工作压力、困扰、反复模式或具体事件时，才继续下面的A/B判断。

⚠️ 判断规则：用户的回答中是否包含一个有明确时间点（如"上周"、"昨天"、"上个月某天"）的具体事件经过？
- 如果**没有**明确时间点和事件经过 → 选情况A（这是大多数情况下的正确选择）
- 如果**已经**描述了一件特定时间发生的事 → 选情况B

🔹 情况A（默认选择）：用户给出的是笼统感受、反复发生的模式、或泛泛描述。无论用户是否提到了具体的人或对象，只要没有说清楚"某一件事是什么时候发生的"，就选A。例如："总是被患者找麻烦"、"最近工作压力很大"、"和同事关系不太好"、"经常被骂"——这些都是情况A。则说：
"可以举个具体的例子吗？比如最近有没有哪件让你印象比较深的事，简单说说是什么时候、在哪儿发生的，当时有谁在场，发生了什么。可以想象你在跟朋友吐槽，想说什么就说什么 😊"

🔹 情况B（仅当用户已有具体事件时）：用户明确说了某件特定的事发生在某个时间点，且描述了事件经过。则说：
"能详细说说这件事吗？比如是什么时候、在哪儿发生的，当时有谁在场，具体发生了什么。可以想象你在跟朋友吐槽，想说什么就说什么 😊"

⚠️ 情况A和情况B的“具体事件”提问都只允许问一次。这里列出的“什么时候、在哪儿、有谁在场、发生了什么”是帮助用户回忆的提示，不是必须逐项填写的清单。只要用户在回答后已经描述了一件可以辨认的具体经历，并说明了核心经过，就视为Q1完成。不要因为用户没有交代地点、所有在场人物或其他细节而再次问“能详细说说这件事吗”。Q1完成后必须直接判断这是人际/沟通型事件还是非人际事件，并进入Q2或Q4。

Q2：这一步【只适用于确实存在明确沟通对象的人际事件】。先根据用户刚刚描述的具体事件判断，事件的核心困难是否来自与某个具体人的互动、冲突、误解、质疑、指责、协作或意见不一致，而且“和这个人沟通”在情境上确实合理。不要因为事件里出现了医院、领导、同事、患者等人物，就自动认为存在“对方”。

- 【人际/沟通型事件】只有满足上述条件时，才问：
  "你当时有没有尝试和对方沟通过你的想法？可以说说细节"
  例如：被患者或家属指责、和同事发生分歧、被领导误解、与某人协作不顺等。

- 【非人际/没有自然沟通对象的事件】如果核心问题主要来自工作量、晋升/科研要求、排班、人手不足、制度要求、职业发展、考试、身体健康、睡眠、疲劳、资源不足、不确定性等，就【完全跳过Q2和Q3】。不要问用户“做了什么来应对/处理”“怎么面对”“有没有帮助”等任何可能引导其思考应对方式的问题。直接进入Q4，问：
  "你有没有和其他人（比如家人、朋友、同事）聊过这件事？"
  例如“晋升要求很高、下班后还要做科研”属于这一类，即使其中提到医院、科室、同事或领导，也不应询问“对方”或“应对”。

⚠️ 如果选择了【人际/沟通型事件】，理解Q2回答时，必须判断用户是否【实际发生过沟通】，不能只看“有/没有”是否出现在句首，也不能因为句子里出现“沟通”两个字就默认用户已经沟通过。请根据整句话的语义判断。
- 【没有实际沟通，但沟通本身仍然是可以想象的】例如明确说“没有/没/还没/没有尝试过/没尝试过/没说过”，或“没机会说”“不敢说”“不知道怎么说”“对方是领导，不太方便说”等。此时可以进入假设分支，先问“如果当时和对方沟通，你觉得对方可能会怎么回应？”。
- 【沟通本身不可行、无法进行，或用户已经明确认为沟通没有意义】必须和普通的“没有沟通”区分开。例如：“无法沟通”“沟通不了”“没法交流”“说不通”“对方根本听不进去”“感觉沟通也没什么用，所以没有尝试过”。这类回答已经说明假设性沟通本身不成立或结果已被用户明确否定，因此【不要】再问“如果当时和对方沟通，对方可能会怎么回应？”，也【不要】问“这样的回应有没有帮助”，因为并不存在一个需要评价的“回应”。系统会简短承接这一沟通障碍并直接进入Q4。
- 【已经实际沟通过，但未说明回应】只要用户明确表示沟通行为已经发生，就视为【已经实际沟通过】，不要求句子一定以“我”开头，也不要求使用“说了”这样的表达。例如：“有和病人家属沟通，告诉他最近病人很多，请他耐心等待”“有跟她沟通过”“和领导谈过这件事”“我跟她说了”“我提过这件事”“我试着跟他谈了”。即使后面补充“对方比较着急/听不进去/沟通效果不好”，只要用户已经明确说自己实际沟通过，就不能问假设性的“如果当时和对方沟通……”。如果尚未说明对方如何回应，则问实际回应：“对方当时是怎么回应你的？”
- 【已经实际沟通过且已说明回应】如果用户已经同时说了自己的沟通行为和对方的回应，例如“我跟她说了，她让我别想太多”，不要再次问“对方是怎么回应的”，只问这种回应对用户是否有帮助或增加压力。

- 核心原则：判断的是“沟通行为是否真的发生过”，而不是句子里有没有出现“沟通”这个词；不要重复询问用户已经通过语义明确回答过的信息。

Q3由系统根据Q2的内容分步提问。Q3只存在于【人际/沟通型事件】中。必须遵守“一次只问一个问题”，不要把“对方如何回应”和“这种回应是否有帮助”合并在同一题里：

**阶段2：情绪分析**
【仅执行阶段2，不要执行其他阶段】

结合用户在阶段1中的描述，提出3-5种最可能贴近用户体验的情绪，供用户辨认和选择。可以参考但不限于以下情绪：焦虑、不安、担忧、害怕、恐惧、郁闷、无奈、失望、难过、不满、委屈、羞耻感、孤独感、无力感、自我怀疑、怨恨、愤怒、烦躁、痛苦、不受尊重等。

这里的目标不是像报告一样“分析”用户，而是像一位成熟、温和、善于倾听的心理咨询师一样，陪着用户一起辨认：在他们刚刚描述的处境里，哪些情绪可能正在发生，以及为什么这些情绪会在这样的处境里出现。必须遵守：
- 用项目符号列出3-5种候选情绪，让用户可以快速看清不同的情绪词。不要编号。
- 每个项目先用Markdown粗体标出情绪名称，例如 **无力感**、**失望**、**焦虑**。后面的解释不需要为了“简短”而压缩成一句敷衍的话；如果需要，可以用1-3句话，把这个情绪和用户已经描述的具体处境真正连接起来。长度以“把话说清楚、让用户觉得被理解”为准，不要为了短而牺牲解释。
- 解释时尽量直接对用户说话，主语优先使用“你”，例如“这可能会让你觉得……”“你一边……一边……时，可能会……”。避免总是用泛化的“让人觉得”“一个人可能会”，因为这里是在回应这个用户的具体经历。
- 像咨询师在帮助来访者辨认情绪时那样，先抓住用户处境里真正有分量的部分，再试探性地说出这个部分可能带来的主观体验。不要只复述事件，也不要只把情绪名称换一种说法。重点回答的是：“在你经历的这些事情里，什么地方可能让你有这种感觉？”
- 可以比用户原话多走半步，把情境中的意义说出来，例如“明明很想把事情做好，但真正能改变的部分却很有限”“一边要顾及A，一边又不能忽略B，怎么选都像会失去一些东西”“事情的结果还没有定下来，但后果又很重要，所以心里可能一直悬着”。但这半步必须紧扣用户已经说过的信息，只能是合理、开放的理解，不能替用户补充新的经历、隐藏动机或心理原因。
- 每种情绪都要有它自己独特的解释逻辑。不要让五个情绪都只是同一个事件换一个情绪词。比如，只有在用户信息支持时：**无力感**可以落在“想改变但能做的很有限”；**焦虑**可以落在“重要结果不确定、还不知道接下来会怎样”；**烦躁**可以落在“持续被几个互相冲突的要求来回拉扯”；**担忧**可以落在“脑子里反复想着某个可能发生的后果”；**失望**可以落在“自己原本希望做到的事和现实条件之间出现落差”。这些只是帮助区分情绪意义的参考，不要机械套用。
- 避免循环解释或敷衍式解释。例如不要写：“面对医保和绩效压力，可能会感到无力”“面对不确定性，可能会觉得焦虑”“担心超支，也许会感到担忧”。这些只是把事件和情绪标签并排放在一起，并没有帮助用户理解自己的体验。
- 更好的解释应该像是在替用户把“那种感觉”说清楚。例如，如果用户确实说到想照顾患者需要、但又受到医保或预算限制，可以写：“**无力感**：你可能很清楚患者需要什么，也希望能尽量按患者的实际情况去做决定，但当医保和科室预算同时限制了可选择的空间时，很多事情并不是你努力一点就能改变的。这种‘想做些什么，却发现自己能推动的部分很有限’的处境，可能会让你感到很无力。”；如果用户确实说到政策变化和绩效后果不确定，可以写：“**焦虑**：你既要处理眼前的治疗决定，又要顾及政策变化和科室绩效，但很多后果在当下其实还不能确定。事情很重要、结果却又不完全可预测时，你可能会一直惦记接下来会发生什么，心里很难真正放下来。”这些只是语气和解释深度的示例，不要照搬，也不要加入用户没有说过的细节。
- 整体语气要温和、自然、试探性，像在和用户一起把感受理清楚，而不是在给出专业判定。可以使用“可能”“也许”“听起来像是”“会不会也有一点……”等开放措辞，但不要使用抽象的“可能和……有关”“可能与……有关”“与……有关”这种报告式句型。
- 不要把情绪说成已经确定的事实。你是在提供可能性让用户辨认，而不是告诉用户“你就是这样”。解释可以有温度，但不能诊断、贴标签或替用户解释隐藏原因。
- 对晋升、考核、科研竞争等情境，如果用户的描述确实支持，也可以考虑 **自我怀疑** 或 **害怕/担忧** 等候选情绪，但不能因为是晋升压力就自动加入；仍然必须根据用户实际描述判断。
- 不要使用“这很正常”“这很自然”“我理解你的感受”“谢谢你的分享”作为固定安慰模板，也不要泛泛地说“面对压力时大家都会……”。

- 如果是从一个已经探索完的情绪继续到下一个，最自然的过渡方式是“接下来我们来聊聊[下一个情绪]。”然后直接进入这个情绪的探索。不要再重复“我们刚刚聊完了……你还想继续聊聊吗？”之类的确认，也不要重新列出全部情绪。
- **每次开始探索一个新的情绪时，在第一个认知问题之前，必须先有一小段有内容的共情与情境重述。不要从“我们来聊聊[情绪]”直接跳到问题。** 这一小段通常用1-2句即可：先结合用户前面真实描述的具体处境，重新表述为什么这个情绪会出现在这段经历里；再温和地承接这种体验对人来说可能有多不容易。重点是让用户先感到“你真的听懂了我经历的是什么”，然后再开始反思问题。
- 可以恢复旧版开场的语气与结构，例如：“我们来聊聊[情绪]。听起来你在面对[结合用户实际经历的具体情境]时感受到这种情绪。像这样的感受确实不容易承受，能够意识到自己有这种感受，是很重要的一步。”这只是语气和结构参考，不是固定模板；必须根据当前事件和当前情绪自然改写，不能机械照搬。
- 共情开场可以适度重述用户处境，但不要只做字面复述，也不要替用户补充隐藏原因、动机或心理结论。不要说“这很正常”“这说明你……”，不要给建议，也不要把这一段写成长篇心理分析。
- 如果是后续情绪，仍然要在“接下来我们来聊聊[下一个情绪]。”之后先用1句简短、贴合该情绪的情境重述或验证，再进入认知问题；可以比第一个情绪更短，避免重复。
- 过渡后的具体措辞继续遵循下面的自然语言原则：结合用户前文和当前情绪自然表达，不要机械套用固定句子。

b. 情绪深入探索的目标是帮助用户把情绪名称和自己的具体体验联系起来，更清楚地理解和描述“这个情绪对我来说是什么样的”。用户已经选择了具体情绪名称，这本身体现了情绪的主观体验（affective component）。接下来保留原有问题和示例，从认知、生理/外在表现、行动倾向，以及具体情境几个方面帮助用户进一步探索。

⚠️ 阶段3最重要的语言原则：
- 下面列出的是每一步**要探索的信息和目的**，不是固定台词或模板。每次提问都必须结合当前情绪、具体事件、人物关系，以及用户刚才实际说了什么来组织自然的中文。
- 阶段3的语气可以参考一位成熟、温和、善于倾听的心理咨询师在简短支持性对话中的回应方式：先让用户感到自己的体验被真正听见和接住，再自然进入下一项探索。这里只借鉴倾听和情绪验证的语气，不进行诊断、治疗解释或解决问题的建议。
- 用户每次分享了与情绪有关的内容后，在进入下一题前，先给1句简短但有内容的情绪验证或共情回应。必要时可以有2句，但不要写成长段。不要只说“嗯，明白了”“好的”“知道了”这类很轻、可能让人觉得被敷衍的话，也不要直接跳过回应。
- 好的验证不是把用户原话换一种说法再重复一遍，而是自然地回应这段体验对人来说可能有多难、其中的压力、拉扯、失落、害怕或辛苦之处。可以适度概括用户已经表达出来的情境与感受之间的联系，让回应听起来像真正理解了这个人的处境，而不是在做心理分析。
- 如果需要比用户原话多走半步，可以使用“听起来……”“像是……”“可能……”等较为开放的表达，把它作为对用户体验的理解，而不是断言隐藏的原因或动机。所有理解都必须紧扣用户已经说过的内容，不凭空增加经历、心理原因或结论。
- 例如，用户说“我担心自己跟不上同事”时，可以自然回应类似“身边的人都在往前走，自己又担心被落下，这种感觉确实挺让人悬着的。”；用户说“我想逃避现实”时，可以回应类似“听起来那一刻这些事情真的压得你很累，很想先从里面退开一下。”；用户说“在看到同事都做得比我好的时候”时，可以回应类似“这种对比一下摆在眼前，心里确实很容易不好受。”这些只是语气示例，不要固定套用。
- 不要反复使用“我理解……”“这很正常”“这很自然”“谢谢你的分享”等固定同理模板，也不要把回应写成研究报告、心理学解释或对用户回答质量的评价。
- 不要用“你刚才提到……”“你刚才说……”“你说的是……”机械复述用户原句；也不要说“这个想法挺具体的”“你说得很清楚”“说得很详细”“表达得很好”等评价回答本身的话。
- 不要只是把[情绪]名称塞进固定句式里。如果某种说法放在当前情绪或情境里听起来别扭、重复、带有预设，必须自然改写。
- 不要用“冲动”“倾向”等研究术语直接问用户，也不要预设用户一定有身体反应、行为反应、想法或想做的事情。
- **不要把用户报告的睡眠、身体感觉或外在表现解释成某个情绪造成的生理反应，也不要用这些表现去证明某个情绪“已经影响到了身体”。** 例如不要说“失眠是身体对这种无力感的一种反应”“这说明这份压力已经影响到了你的休息和恢复”“心跳快说明焦虑已经影响到身体”。这些说法带有未经用户确认的因果或临床解释。这里的任务只是接住用户描述的体验，而不是解释它为什么发生。更自然的回应可以是“连晚上都很难睡着，听起来那段时间确实很难真正放松下来”或“睡不好本身就很消耗人”，然后自然进入下一项探索。
- 如果用户已经在前面的回答中明确提供了某一步需要的信息，简短回应后直接进入还没有探索的内容，不要机械重复。
- **同一个情绪下，每一种探索内容最多问一次。** 尤其是行为/动机问题，用户回答过“想做什么、说什么或避开什么”后，后面绝对不要再以不同措辞重复询问这一内容。
- 在提出下一题前，先回看当前情绪已经问过并得到回答的内容，只进入尚未探索的下一项。顺序为：认知 →（整个阶段3尚未问过时才问一次整体身体/外在表现）→ 行为/动机 → 具体情境。完成具体情境后，这个情绪的探索已经结束，不得再回到认知、身体或行为/动机问题。
- 每次只问一个主要问题。问题本身可以鼓励用户充分表达，但措辞要给用户空间，例如“如果愿意，可以尽量具体地说说”“能想到多少就说多少”。不要使用让用户感觉必须长篇解释的命令式措辞。收到回答后不要围绕同一方面继续追加追问。
- 在认知问题中，原则上给1-2个很短的例子来帮助用户理解问题；只有确实无法生成自然且合适的例子时才省略。其他问题是否需要例子，根据当前语境决定。所有例子都必须根据**当前情绪 + 当前具体事件**即时生成；不要使用固定例子、通用模板或跨情绪重复同样的例子，也不要暗示例子就是用户真实的体验。
- 生成例子前，先判断**当前情绪在这个具体情境中的核心体验是什么**。例子不仅要符合事件背景，也必须真正贴合当前情绪本身。不要只生成“在这个事件里说得通”的想法；如果一个例子其实更像另一种情绪（例如更像委屈、无奈、害怕等），就不要用于当前情绪。
- 如果认知问题实在无法生成既自然、又同时符合当前情绪和当前情境的例子，可以省略例子，直接自然地询问用户当时脑海里最直接冒出的想法。
- 每次阶段3提问后，在回复最末尾加上对应的内部标记：认知问题 [[S3_COG]]；整体身体/外在表现问题 [[S3_BODY]]；行为/动机问题 [[S3_ACTION]]；具体情境问题 [[S3_CONTEXT]]。这些标记只用于程序追踪，不要解释它们，也不要把它们放在句子中间。

对每个情绪，逐步完成以下探索目标。顺序原则保持不变，但具体问法必须自然适配上下文：

1）认知（cognitive）
探索目标：帮助用户注意这种情绪出现时，当时脑海里最直接冒出的具体想法。
**如果这是刚开始探索这个情绪的第一个问题，必须先完成上面的共情开场，再提出认知问题；不要直接从“我们来聊聊[情绪]”接到认知提问。认知问题本身的结构保持不变。**
问法要自然、具体、容易理解，并给用户充分表达的空间。可以采用“当时这种感受出现的时候，你脑海里最直接会冒出什么想法？如果愿意，可以尽量具体地说说。”这一类自然表达作为风格参考，但不要固定使用某一句模板，也不要再问“这些想法是怎样和当时的情境联系起来的”之类抽象问题。
原则上在这个问题里给1-2个很短的可能想法作为例子，帮助用户理解你在问什么。例子必须根据当前事件和当前情绪即时生成：先判断这个情绪在当前事件中的核心体验，再检查每个例子是否真的体现**这个情绪**，而不只是符合事件本身。如果例子更像其他情绪，删掉并重新生成。只有实在无法生成自然且贴切的例子时，才可以不举例。引出例子时直接自然地说“比如‘……’或‘……’”即可，不要说“比如你会不会想……”这类带预设的句式。例子不得照搬固定示例，也不要在例子后再追加“你当时自己是怎么想的？”等重复追问。
提问末尾加：[[S3_COG]]

收到回答后：只要用户已经给出了一个实际想法，无论长短，认知部分就视为完成。先用1句自然、有分量的情绪验证回应用户刚才表达的体验，语气参考上面的咨询师式倾听原则；不要机械复述原句，也不要评价回答本身。然后直接进入下一项。如果整个阶段3还没有询问过身体/外在表现，则自然进入第2步；如果已经问过，则自然进入第3步。绝对不要再问“还有其他想法吗”“还能想到什么”“除此之外还有什么念头”等第二个认知问题，也不要因为用户回答较短而继续追问认知。不要停在单纯回应上。

2）生理与外在表现（physiological / expressive）
这一部分在整个阶段3中**只问一次**，通常放在第一个正在探索的情绪中；后面的情绪不要重复询问。虽然只问一次，但提问时可以自然地结合当前正在探索的情绪，而不是刻意写成抽象的“整体情绪体验”。
探索目标：帮助用户停下来回想，当这种情绪出现时，身体、睡眠或外在表达有没有和平时不太一样的地方。
- 问法要像咨询师在帮助来访者回到当时的体验，而不是像问卷。优先使用类似这样的自然结构：“你在感觉到这种[当前情绪]的时候，呼吸、心跳、睡眠，或者说话的语气有没有什么和平时不太一样的地方？请稍微花一点时间回想一下。” 这是语气和结构参考，不要求逐字照搬。
- **这一题不要再用“如果愿意，可以尽量具体地说说”作为结尾。** 改为邀请用户稍微停下来回想，例如“请稍微花一点时间回想一下”“你可以回想一下当时有没有什么和平时不太一样的地方”。
- 不要预设一定有变化，应给用户空间回答“没有明显变化”“没注意到”“不知道”。
- 可以自然地点到呼吸、心跳、睡眠、说话的语气或表情等方面，但只把它们作为帮助回想的方向，不要替用户预设具体反应。不要说“脸红”“呼吸急促”“心跳加快”等具体变化，除非用户自己已经说过。
- 措辞必须自然，不要用“身体上有什么表现”“语气里有什么特别的表现”等研究化或生硬的说法。
提问末尾加：[[S3_BODY]]

收到回答后：先用1句自然、有分量的情绪验证回应用户刚才描述的体验，语气参考上面的咨询师式倾听原则；不要机械复述身体反应，也不要评价回答本身。**尤其不要把睡眠问题、身体感觉或外在表现直接归因于当前情绪，不要说“X是身体对这种情绪的反应”“这说明这种情绪已经影响到你的身体/休息/恢复”等。** 如果用户说“会失眠”，可以回应类似“连晚上都很难睡着，听起来那段时间确实很难真正放松下来”或“睡不好本身就很消耗人”，但不要解释失眠是由无力感、焦虑或压力造成的。然后在同一条消息里自然进入第3步。不要继续追问身体反应，也不要只回应后停住。

3）行为/动机（motivational / action tendency）
探索目标：帮助用户注意这种情绪是否让他们特别想做什么、说什么，或者想避开什么。这里是在回顾当时自然出现的反应，不是让用户制定下一步行动，也不是给建议。
问法必须根据当前情绪和前文自然组织，并在不预设用户一定有这种反应的前提下，给用户空间说说当时想做什么、想说什么或想避开什么；如果愿意，可以尽量具体。不要使用“你的冲动或倾向是什么”之类的研究化表达，也不要预设用户一定有某种冲动或行为反应。
像“这种烦躁出现时，会让你特别想做什么、说什么，或者想避开什么吗？”这样的表达可以作为自然语言风格的参考，但**不是固定模板**；如果当前情绪、语境或用户刚才的回答更适合别的说法，应自然改写。
如需举例，最多给1-2个，并且必须根据当前情绪和具体事件即时生成；如果不需要例子就不要硬加。
提问末尾加：[[S3_ACTION]]

收到回答后：先用1句自然、有分量的情绪验证回应用户刚才表达的体验，语气参考上面的咨询师式倾听原则；不要机械复述用户想做、想说或想避开的内容，也不要评价回答本身。然后在同一条消息里自然进入第4步。**第3步到此已经完成；之后不要再以任何措辞重复询问用户想做什么、想说什么或想避开什么。**

4）具体情境与强度（affective/context）
探索目标：帮助用户把这种情绪放回事件中的具体时刻，区分它什么时候最明显、当时发生了什么，以及为什么那个时刻与这种感受有关。
- 只要用户已经明确指出这种情绪最明显的时刻、条件或触发情境，就视为这一部分已经回答完成，即使回答很简短。例如“在看到同事都做得比我好的时候”“在有很多事情要做的时候”“开会被点名的时候”都已经是有效的具体情境回答。不要因为用户没有继续解释‘当时发生了什么’而再次追问或要求展开；直接进入当前情绪的总结。
提问时根据前文自然询问这种情绪在哪个时刻最明显或最强烈，并邀请用户在愿意的情况下尽量具体地描述那个时刻发生了什么、当时的情境是什么。不要机械地把“发生了什么、有谁在场、你有什么反应”全部堆在一句里；如果前文已经知道其中一些信息，就只问尚不清楚且有助于理解情绪的部分。
如果用户说不确定，可以轻柔地邀请他们回想整件事里这种感受最明显的一刻，但不要替用户推断。
提问末尾加：[[S3_CONTEXT]]

收到第4步回答后，当前情绪的四步探索即告完成。**不要再回头询问认知、身体/外在表现或行为/动机，也不要把第3步换一种说法再问一次。** 先对当前情绪进行整体总结，结合用户在以上各方面实际提供的信息，帮助他们把零散的体验联系起来。总结必须写成1个简短、自然的对话式段落，不要使用项目符号、分项标题、“情绪：原因”或逐条分析的格式。优先复述用户自己已经建立的联系，例如“你刚才提到……的时候，这种感受最明显，同时你脑子里会想到……”。只有当用户自己明确说过某个原因或联系时，才可以把两者连起来；不要替用户补充心理原因。不要使用诊断口吻，也不要给解决问题的建议。若还有下一个已选择但未探索的情绪，总结后用“接下来我们来聊聊[下一个情绪]。”自然过渡，并直接从该情绪的认知问题开始。

如果用户选择了多个情绪：
- 每个情绪都分别探索认知、行为/动机和具体情境；整体身体/外在表现通常只在整个阶段3问一次。
- 不要因为顺序相同就把不同情绪问成相同的机械问卷。每一次提问都要利用用户前面已经说过的信息，让措辞和关注点自然变化。
- 如果某个问题在当前情绪下明显不自然，先判断用户是否已经在前文提供了相关信息；如果已经提供，就不要再问。如果尚未提供，则换一种更符合当前语境的自然问法，而不是硬套模板。

完成一个情绪的上述探索并给出总结后，立即按以下逻辑决定下一步：

❌ 严格禁止在这里说"你刚才提到了这些情绪：[X]。我们会一个一个来聊。你想先从哪一个开始呢？"——那句话只用于阶段2→3的开场，绝不能在情绪探索结束后重复。

✅ 正确做法，根据用户在阶段2选择的情绪数量：

**情况A：用户只选了一个情绪，探索完毕**
→ 给出总结后，**空一行**，再把下面的问题单独放在一个新段落中：
"我们刚刚聊完了[情绪]。你还有其他关于这件事的感受或情绪想继续聊聊吗？"
→ 总结段落和这个问题之间必须使用一个完整空行（也就是输出两个换行符），不要把它们连在同一个自然段里。
→ 用户说有 → 按上述同样的探索逻辑继续探索该情绪。
→ 用户说没有 → 在同一条消息中直接过渡并立即提问阶段4的Q1（不要停下来等待用户回应过渡语）：
"好的，谢谢你的分享。下面，我们再来评估一下你对这件事的感受。请根据你此刻最真实的感觉来回答，无论它和你之前的回答是不是一样，都没有关系。
在一开始的时候，你提到了[简短重述阶段1中的具体事件]。这件事在此刻让你觉得有多困扰？
1 ○○○○○○○ 完全不困扰
2 ●○○○○○○
3 ●●○○○○○
4 ●●●○○○○
5 ●●●●○○○
6 ●●●●●○○
7 ●●●●●●● 非常困扰
请在1-7中选择一个最符合的数字"

**情况B：用户选了多个情绪，还有未探索的**

  const bjt = new Date(date.getTime() + 8 * 60 * 60 * 1000);
  return bjt.toISOString().replace('T', ' ').slice(0, 19) + ' (BJT)';
}

function getDurationSnapshot() {
  const now = new Date();
  const elapsedSeconds = function(start, end) {
    if (!start) return null;
    return Math.round(((end || now) - start) / 1000);
  };

  return {
    duration: elapsedSeconds(startTime, null),
    stage1_duration: elapsedSeconds(stageTimes.stage1_start, stageTimes.pre_measure_start),
    pre_measure_duration: stageTimes.pre_measure_start
      ? elapsedSeconds(stageTimes.pre_measure_start, stageTimes.stage2_start)
      : null,
    emotion_duration: stageTimes.stage2_start
      ? elapsedSeconds(stageTimes.stage2_start, stageTimes.post_measure_start)
      : null,
    post_measure_duration: stageTimes.post_measure_start
      ? elapsedSeconds(stageTimes.post_measure_start, stageTimes.another_start)
      : null,
    another_event_duration: stageTimes.another_start
      ? elapsedSeconds(stageTimes.another_start, stageTimes.another_end)
      : null
  };
}

        stress_event:      textData.stress_event,
        specific_event:    textData.specific_event,
        selected_emotions: textData.selected_emotions,
        another_event:     textData.another_event || leasResponse,
        another_emotion:   textData.another_emotion,
      };
      if (larkRowNumber) {
        payload.row_number = larkRowNumber;
        const resp = await fetch(PROXY_URL + '/save-update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true });
        const data = await resp.json().catch(function() { return {}; });
        if (!resp.ok) throw new Error('Lark /save-update failed: HTTP ' + resp.status + ' ' + JSON.stringify(data));
        console.log('[Save] Updated row', larkRowNumber);
      } else {
        const resp = await fetch(PROXY_URL + '/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true });
        const data = await resp.json().catch(function() { return {}; });

        if (!data.rowNumber) throw new Error('Lark /save returned no rowNumber: ' + JSON.stringify(data));
        larkRowNumber = data.rowNumber;
        console.log('[Save] New row created at row', larkRowNumber);

  });
}

function renderStandaloneScale(container, leftLabel, rightLabel, questionId) {
  const widget = document.createElement('div');

  hint.className = 'scale-hint';

  optsDiv.className = 'scale-options';

    btn.className = 'scale-opt';

function renderMatrix(items, title, storageKey, btnLabel, onComplete) {
  console.log('[Matrix] renderMatrix called:', title);
  try {
  const slot = document.getElementById('matrixSlot');
  slot.style.display = 'block';
  slot.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'matrix-card';
  card.id = 'activeMatrix';

  const wrap = document.createElement('div');
  wrap.className = 'matrix-table-wrap';

  const table = document.createElement('table');
  table.className = 'matrix-table';

  // Header
  const thead = document.createElement('thead');
  const hrow  = document.createElement('tr');
  const th0   = document.createElement('th');
  hrow.appendChild(th0);
  for (let i = 1; i <= 7; i++) {
    const th = document.createElement('th');
    if (i === 1) th.innerHTML = '1<br>' + SCALE_LEFT;
    else if (i === 7) th.innerHTML = '7<br>' + SCALE_RIGHT;
    else th.textContent = i;
    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  // Body
  const tbody    = document.createElement('tbody');
  const responses = new Array(items.length).fill(null);

  items.forEach(function(item, rowIdx) {
    const tr  = document.createElement('tr');
    const tdL = document.createElement('td');
    tdL.textContent = item;
    tr.appendChild(tdL);

    for (let col = 1; col <= 7; col++) {
      const td    = document.createElement('td');
      const radio = document.createElement('div');
      radio.className = 'matrix-radio';
      radio.setAttribute('data-row', rowIdx);
      radio.setAttribute('data-val', col);

      radio.addEventListener('click', function() {
        // Uncheck siblings in same row
        tbody.querySelectorAll('[data-row="' + rowIdx + '"]').forEach(function(r) {
          r.classList.remove('checked');
        });
        radio.classList.add('checked');
        responses[rowIdx] = col;
        matrixData[storageKey][rowIdx] = col;
        console.log('[Matrix] ' + storageKey + '[' + rowIdx + '] = ' + col, '| responses:', responses.slice());
        // Enable submit when all answered
        if (responses.every(function(v) { return v !== null; })) {
          submitBtn.disabled = false;
        }
      });

      td.appendChild(radio);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);

  const footer    = document.createElement('div');
  footer.className = 'matrix-footer';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'matrix-submit';
  submitBtn.textContent = btnLabel;
  submitBtn.disabled = true;

  submitBtn.addEventListener('click', function() {
    submitBtn.disabled = true;
    // Freeze all radio buttons
    card.querySelectorAll('.matrix-radio').forEach(function(r) {
      r.style.pointerEvents = 'none';
    });
    onComplete();
  });

  footer.appendChild(submitBtn);
  card.appendChild(footer);
  slot.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  console.log('[Matrix] card rendered in matrixSlot');
  } catch(e) { console.error('[Matrix] renderMatrix ERROR:', e.message, e.stack); }
}

          content: '【当前流程状态：Control阶段2生活状态了解】前测状态量表已经完成。下一条助手回复必须且只能开始Control阶段2，不要跳到后测或最终总结。'
        });
      }
      console.log('[PreMatrix] Complete, stage:', currentStage);

      stageTimes.stage2_start = new Date();
      submitResponse('量表已完成，可以继续了');
    });
  });
}

function startPostMatrices() {
  stageTimes.post_measure_start = new Date();
  matrixPhase = 3;
  document.getElementById('chatSubmit').disabled = true;
  document.getElementById('chatInput').disabled  = true;

  const postMatrixIntro = '下面请根据你**此刻**的状态回答下面的问题：';
  s.push({ role: 'assistant', content: postMatrixIntro });
  appendMsg('ai', postMatrixIntro);

  renderMatrix(ANXIETY_ITEMS, '问卷 1/2：状态焦虑', 'state_anxiety_post', '下一题 →', function() {
    document.getElementById('matrixSlot').innerHTML = '';
    matrixPhase = 4;
    renderMatrix(STRESS_ITEMS, '问卷 2/2：状态压力', 'state_stress_post', '提交', function() {
      document.getElementById('matrixSlot').style.display = 'none';
      document.getElementById('matrixSlot').innerHTML = '';
      matrixPhase = 0;
      document.getElementById('chatSubmit').disabled = false;
      document.getElementById('chatInput').disabled  = false;
      // Advance to LEAS/summary stage directly — don't rely on AI trigger phrase
      const SUMMARY_STAGE = CONDITION === 'emotion' ? 5 : 4;
      currentStage = SUMMARY_STAGE;
      currentQuestion = 0;
      s.push({
        role: 'system',
        content: CONDITION === 'emotion'
          ? '【当前流程状态：阶段5】后测状态量表已经完成。现在只能执行阶段5：先询问另一件类似经历；不要返回阶段2、阶段3或阶段4。'
          : '【当前流程状态：Control阶段4】后测状态量表已经完成。现在只能执行Control阶段4的迁移问题与最终总结。'
      });
      console.log('[PostMatrix] Stage advanced to summary stage:', currentStage);
      submitResponse('量表已完成，请继续');
    });
  });
}

// Chat UI
function appendMsg(role, text) {
  const log = document.getElementById('chatLog');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? '你' : '小暖';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  const postScaleStageLocal = CONDITION === 'emotion' ? 4 : 3;
  const _isScale = role === 'ai' && isScaleMessage(text);
  const _isPostQ1 = role === 'ai' && currentStage === postScaleStageLocal && currentQuestion === 1 && text.includes('有多困扰');
  if (_isScale || _isPostQ1) {
    row.style.alignItems = 'stretch';
    bubble.style.maxWidth = '100%';
    bubble.style.width = '100%';
    bubble.style.borderRadius = '14px';
    const { cleanText, leftLabel, rightLabel } = parseScaleMessage(text);
    bubble.innerHTML = cleanText.replace(/\n/g, '<br>');
    renderScaleWidget(bubble, leftLabel || '完全不困扰', rightLabel || '非常困扰');
  } else {
    const formatted = text
      .split(/\r?\n/)
      .map(function(line) { return /^\s*-\s+/.test(line) ? line.replace(/^\s*-\s+/, '• ') : line; })
      .join('\n')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>')
      .replace(/([1-7]\s+[●○]+)/g, '<br>$1')
      .replace(/^<br>/, '');
    bubble.innerHTML = formatted;
  }
  row.appendChild(label);
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

// Scale tracking
function parseAndSaveScale(text) {
  const match = text.match(/\d+/);
  const val = match ? parseInt(match[0]) : null;
  const postScaleStage = CONDITION === 'emotion' ? 4 : 3;
  if (anotherScaleActive) {
    if      (anotherScaleQuestion === 1) scales.emotion_identify_reverse_another = val;
    else if (anotherScaleQuestion === 2) scales.emotion_identify_another = val;
    else if (anotherScaleQuestion === 3) scales.emotion_describe_hard_another = val;
    else if (anotherScaleQuestion === 4) scales.emotion_describe_easy_another = val;
    return;
  }
  if (currentStage === 1) {
    if      (currentQuestion === 7)  scales.distress_level_1 = val;
    else if (currentQuestion === 8)  scales.emotion_identify_reverse_1 = val;
    else if (currentQuestion === 9)  scales.emotion_identify_1 = val;
    else if (currentQuestion === 10) scales.emotion_describe_hard_1 = val;
    else if (currentQuestion === 11) { scales.emotion_describe_easy_1 = val; }
  }
  if (currentStage === postScaleStage) {
    if      (currentQuestion === 1)  scales.distress_level_2 = val;
    else if (currentQuestion === 2)  scales.emotion_identify_reverse_2 = val;
    else if (currentQuestion === 3)  scales.emotion_identify_2 = val;
    else if (currentQuestion === 4)  scales.emotion_describe_hard_2 = val;
    else if (currentQuestion === 5) {
      scales.emotion_describe_easy_2 = val;
      if (!postMatricesStarted) {
        postMatricesStarted = true;
        setTimeout(startPostMatrices, 500);  // show matrices AFTER all post-scales done
      }
    }
  }
}

// State machine
function updateState(t) {
  // Set capture flags only when the corresponding stage is actually active.
  // This prevents a malformed AI reply from silently advancing the study flow.
  if (currentStage === 1 && (t.includes("可以跟我说说最近在工作上") || t.includes("如果最近没有，能不能回想一下以前在工作中") || t.includes("你是说最近没有这样的工作经历"))) pendingCapture = 'stress_event';
  if (currentStage === 1 && (t.includes("能详细说说这件事吗") || t.includes("可以举个具体的例子吗"))) pendingCapture = 'specific_event';
  if (CONDITION === 'emotion' && currentStage === 2 && (t.includes("你觉得这些情绪里哪些符合你的感受") || t.includes("请尽可能把所有符合的都选出来"))) pendingCapture = 'selected_emotions';

  const summaryStage = CONDITION === 'emotion' ? 5 : 4;
  if (currentStage === summaryStage && (t.includes("别的让你困扰或有压力的经历") || t.includes("其他类似的经历") || t.includes("任何让你困扰或者有压力的经历"))) pendingCapture = 'another_event';
  else if (currentStage === summaryStage && t.includes("在这件事中，你有什么感受或情绪")) pendingCapture = 'another_emotion';

  // Global: always fire on chat end regardless of stage
  if (t.includes("本次对话到此结束")) {
    saveToLark();
    setTimeout(showContinueButton, 800);
    return;
  }
  if (currentStage === 1) {
    if      (t.includes("工作的哪个方面"))                                  currentQuestion = 1;
    else if (t.includes("描述一下这件具体发生的事吗") || t.includes("可以举个具体的例子吗") || t.includes("能详细说说这件事吗")) currentQuestion = 1;
    else if (t.includes("你当时有没有尝试和对方沟通过你的想法") || t.includes("和对方沟通过你的想法")) { currentQuestion = 2; q2Mode = 'communication'; }  // interpersonal Q2
    else if (t.includes("对方当时是怎么回应你的") || t.includes("对方可能会怎么回应") || t.includes("处理当时的情况") || t.includes("有助于处理这件事") || t.includes("这样做对你应对这件事有帮助吗")) currentQuestion = 3;  // Q3 step delivered → user will answer Q3
    else if (t.includes("有没有跟当时不在场的人") || t.includes("有没有和其他人（比如家人、朋友、同事）聊过这件事") || t.includes("有没有和其他人聊过这件事")) currentQuestion = 4;  // AI asked Q4 → user will answer Q4
    else if (/(?:是和谁聊的呢|当时(?:分别)?是怎么回应你的|这样的回应对你有帮助吗|这些回应对你有帮助吗|如果当时和.+说起这件事|这样的回应会对你有帮助吗|你当时是跟谁聊了这件事|你是说后来有跟别人聊过这件事)/.test(t)) currentQuestion = 5;  // Q5 step delivered → user will answer Q5
    else if (t.includes("有多困扰"))                                        currentQuestion = 7;
    else if (t.includes("很强烈的情绪"))                                    currentQuestion = 8;
    else if (t.includes("我清楚自己现在"))                                  currentQuestion = 9;
    else if (t.includes("难以用准确的语言来描述"))                          currentQuestion = 10;
    else if (t.includes("能很容易地描述"))                                   currentQuestion = 11;
    else if (t.includes("谢谢你的回答")) { currentStage = 2; currentQuestion = 0; setTimeout(startPreMatrices, 500); }
    return;
  }
  if (CONDITION === 'emotion') {
    if (currentStage === 2) {
      if (t.includes("我们来聊聊")) {
        currentStage = 3;
        const firstStage3Question = classifyStage3Question(t);
        if (firstStage3Question === 'COG') currentQuestion = 1;
        else if (firstStage3Question === 'BODY') { currentQuestion = 2; stage3BodyQuestionAsked = true; }
        else if (firstStage3Question === 'ACTION') currentQuestion = 3;
        else if (firstStage3Question === 'CONTEXT') currentQuestion = 4;
        else currentQuestion = 0;
      }
    } else if (currentStage === 3) {
      if      (t.includes("我们再来评估一下"))                      { currentStage = 4; currentQuestion = 1; }
      else if (t.includes("[[S3_COG]]"))                           currentQuestion = 1;
      else if (t.includes("[[S3_BODY]]"))                        { currentQuestion = 2; stage3BodyQuestionAsked = true; }
      else if (t.includes("[[S3_ACTION]]"))                         currentQuestion = 3;
      else if (t.includes("[[S3_CONTEXT]]"))                        currentQuestion = 4;
      // Fallbacks for older model outputs that omit the internal marker.
      else if (/脑海.{0,12}(?:想法|想到)/.test(t))                    currentQuestion = 1;
      else if (/(?:身体|外在).{0,18}(?:变化|感觉|表现)/.test(t))      { currentQuestion = 2; stage3BodyQuestionAsked = true; }
      else if (/(?:想做什么|想说什么|想避开|想躲开)/.test(t))         currentQuestion = 3;
      else if (/(?:最明显|最强烈).{0,12}(?:时候|时刻)/.test(t))       currentQuestion = 4;
    } else if (currentStage === 4) {
      if      (t.includes("有多困扰"))                              currentQuestion = 1;
      else if (t.includes("有很强烈的情绪"))                        currentQuestion = 2;
      else if (t.includes("清楚自己现在对这件事"))                  currentQuestion = 3;
      else if (t.includes("难以用准确的语言"))                      currentQuestion = 4;
      else if (t.includes("能很容易地描述"))                        currentQuestion = 5;
      else if (t.includes("谢谢你的分享"))                          { currentStage = 5; }
    } else if (currentStage === 5) {
      if ((t.includes("别的让你困扰或有压力的经历") || t.includes("其他类似的经历") || t.includes("任何让你困扰或者有压力的经历")) && !leasAsked) {
        leasAsked = true;
        stageTimes.another_start = new Date();
      }
      if (t.includes("本次对话到此结束"))                            { saveToLark(); setTimeout(showContinueButton, 800); }
    }
  } else { // control
    if (currentStage === 2) {
      if ((t.includes("再进行一个评估") || t.includes("在一开始的时候，你提到")) && currentStage === 2) { currentStage = 3; currentQuestion = 1; }
    } else if (currentStage === 3) {
      if ((t.includes("再进行一个评估") || t.includes("在一开始的时候，你提到")) && currentStage === 2) { currentStage = 3; currentQuestion = 1; }
      if      (t.includes("有多困扰"))                              currentQuestion = 1;
      else if (t.includes("有很强烈的情绪"))                        currentQuestion = 2;
      else if (t.includes("清楚自己现在对这件事"))                  currentQuestion = 3;
      else if (t.includes("难以用准确的语言"))                      currentQuestion = 4;
      else if (t.includes("能很容易地描述"))                        currentQuestion = 5;
      else if (t.includes("谢谢你的分享"))                          { currentStage = 4; }
    } else if (currentStage === 4) {
      if ((t.includes("别的让你困扰或有压力的经历") || t.includes("其他类似的经历") || t.includes("任何让你困扰或者有压力的经历")) && !leasAsked) {
        leasAsked = true;
        stageTimes.another_start = new Date();
      }
      if (t.includes("本次对话到此结束"))                            { saveToLark(); setTimeout(showContinueButton, 800); }
    }
  }
}

// Stage-3 tracking uses invisible markers so the model can phrase questions naturally
// instead of relying on fixed wording/templates. Markers are stripped before display.
let stage3BodyQuestionAsked = false;

function getStage3Marker(text) {
  const m = text.match(/\[\[S3_(COG|BODY|ACTION|CONTEXT)\]\]/);
  return m ? m[1] : null;
}


function normalizeStage1RoutingReply(reply) {
  // Safety guard: non-interpersonal events must never be turned into a coping exercise.
  // If the model emits the retired coping question, skip it and ask Q4 directly.
  if (typeof reply !== 'string') return reply;
  if (reply.includes('你当时有没有尝试做些什么来应对或处理这件事') ||
      reply.includes('有没有做过什么来应对或处理这件事') ||
      reply.includes('你觉得这样做对你应对这件事有帮助吗')) {
    console.warn('[Stage1 routing] Replaced retired coping question with Q4.');
    return Q4_NONINTERPERSONAL;
  }
  return reply;
}

function stripStage3Markers(text) {
  return text.replace(/\s*\[\[S3_(?:COG|BODY|ACTION|CONTEXT)\]\]\s*/g, '').trim();
}

function classifyStage3Question(text) {
  const marker = getStage3Marker(text);
  if (marker) return marker;
  // Semantic fallbacks in case the model omits the internal marker.
  if (/(?:脑海|脑子|心里).{0,24}(?:想法|想到|冒出|念头)|(?:还有|其他|别的).{0,12}(?:想法|念头)|(?:还能|还会).{0,12}(?:想到|想些什么|有什么想法)/.test(text)) return 'COG';
  if (/(?:身体|外在).{0,20}(?:变化|感觉|表现)/.test(text)) return 'BODY';
  if (/(?:想做什么|想说什么|想避开|想躲开)/.test(text)) return 'ACTION';
  if (/(?:最明显|最强烈).{0,14}(?:时候|时刻)|哪个时刻.{0,12}(?:明显|强烈)|(?:那时|当时|那个时候).{0,14}(?:发生了什么|是什么情况)|(?:具体|详细).{0,10}(?:说说|描述).{0,18}(?:时刻|时候|情境)/.test(text)) return 'CONTEXT';
  return null;
}

function stage3OpeningHasEmpathicLeadIn(text) {
  if (typeof text !== 'string') return false;

  // Only evaluate turns that are actually starting an emotion and already contain
  // the first cognition question. A multiple-emotion "which one first?" turn is
  // allowed to remain brief because the empathic lead-in comes after the choice.
  if (classifyStage3Question(text) !== 'COG') return true;

  const visible = stripStage3Markers(text);
  const questionIndex = visible.search(/[？?]/);
  const beforeQuestion = questionIndex >= 0 ? visible.slice(0, questionIndex) : visible;

  // Require genuine contextual/empathic content before the first question,
  // rather than only "我们来聊聊X。" followed immediately by the cognition prompt.
  const hasEmpathicLanguage = /(?:听起来|看起来|像是|确实|不容易|不轻松|辛苦|难受|承受|消耗|让人|压得|拉扯|被困住|不由自己|很难)/.test(beforeQuestion);
  const hasContextualLeadIn = beforeQuestion.replace(/^\s*(?:接下来)?我们来聊聊[^。！？!?]*[。！？!?]?\s*/, '').trim().length >= 16;

  return hasEmpathicLanguage && hasContextualLeadIn;
}

function stage3ReplyHasNextQuestion(text) {
  return !!classifyStage3Question(text) || text.includes('我们再来评估一下');
}

function stage3ContextAnswerIsSufficient(text) {
  const t = String(text || '').trim();
  if (!t) return false;
  if (/^(?:不知道|不确定|想不起来|记不清|没有特别|没什么特别)[。！!，,、~～\s]*$/.test(t)) return false;
  if (/(?:在|当|每当|尤其是|特别是).{1,28}(?:时候|时|那一刻|情况下)/.test(t)) return true;
  if (/^(?:看到|听到|想到|遇到|碰到|被|工作|开会|值班|下班|考试|晋升|考核).{2,40}$/.test(t)) return true;
  return t.length >= 6;
}

function expectedStage3NextQuestion() {
  if (currentQuestion === 1) return stage3BodyQuestionAsked ? 'ACTION' : 'BODY';
  if (currentQuestion === 2) return 'ACTION';
  if (currentQuestion === 3) return 'CONTEXT';
  return null;
}

function shouldRepairStage2EmotionFormat(text) {
  if (CONDITION !== 'emotion' || currentStage !== 2 || typeof text !== 'string') return false;

  // While currentStage===2, the ONLY valid assistant reply is the Stage-2
  // candidate-emotion list followed by the emotion-selection question.
  // This prevents the model from accidentally jumping straight to a later stage
  // (for example the another-event question) after the pre-measures.
  const hasSelectionQuestion =
    text.includes('你觉得这些情绪里哪些符合你的感受') ||
    text.includes('请尽可能把所有符合的都选出来');
  if (!hasSelectionQuestion) return true;

  const bulletLines = text.split(/\r?\n/).filter(function(line) {
    return /^\s*[-•]\s+\*\*[^*]+\*\*\s*[：:]/.test(line);
  });
  return bulletLines.length < 3;
}

function getStage2FormatRepairInstruction() {
  return `【当前流程状态：阶段2情绪分析。不得跳到阶段3、阶段4或阶段5。】你刚才的回复没有严格执行阶段2。请只重新生成这一条阶段2回复，并严格使用下面的版式和语气：
1. 先用一句很短的自然过渡语。
2. 接着列出3-5个候选情绪，每个情绪必须单独一行，格式必须是：- **情绪名称**：解释。解释不必刻意很短；如果需要，可以用1-3句话把这个情绪为什么可能出现在用户的具体处境里说清楚。
3. 解释时优先直接对用户说话，主语使用“你”，例如“这可能会让你……”“你一边……一边……时，可能会……”。不要反复写泛化的“让人觉得”。
4. 语气要像一位成熟、温和的心理咨询师在帮助来访者辨认自己的情绪：先抓住用户处境里真正有分量的部分，再试探性地解释这个部分可能带来的主观体验。重点回答“在你经历的这些事情里，什么地方可能让你有这种感觉？”，而不是把事件和情绪标签简单并排。
5. 每条说明可以比用户原话多走半步，例如指出“想改变但能控制的空间很少”“重要结果不确定”“同时被两个互相冲突的要求拉扯”“反复担心某个后果”“期待和现实之间有落差”等，但只有用户已经提供的信息支持时才能这样解释。不得编造新的经历、动机或心理原因。
6. 不同情绪必须体现不同的主观意义。不要让所有项目都只是“面对X，可能感到Y”，也不要把同一套解释换一个情绪名称重复使用。
7. 禁止循环、敷衍式写法，例如“面对医保和绩效压力，可能会感到无力”“面对不确定性，可能会觉得焦虑”“担心超支，也许会感到担忧”。要把为什么说清楚，让用户读完能看懂这种情绪是怎样从自己的处境里产生的。
8. 每个候选情绪都必须用Markdown粗体标出情绪名称。不要把多个候选情绪合并在同一个自然段里。
9. 列表之后，再单独一段询问：你觉得这些情绪里哪些符合你的感受？请尽可能把所有符合的都选出来，可以多选。如果你还有其他没有提到的感受，也可以告诉我。
10. 不要使用“可能和……有关”“可能与……有关”“与……有关”这种抽象、报告式的句型。保持开放、试探性的语气，不要把候选情绪说成已经确定的事实。
只输出修改后的参与者可见回复，不要解释格式规则。`;
}

function stage3AcknowledgementNeedsRepair(text) {
  if (typeof text !== 'string') return false;

  if (/(?:这个|这|你的)?(?:想法|回答|描述|表达).{0,8}(?:挺|很|比较)?(?:具体|清楚|详细|完整|好)|(?:说|讲|描述|表达)得.{0,6}(?:很|挺|比较)?(?:具体|清楚|详细|完整|好)/.test(text)) {
    return true;
  }

  if ([1, 2, 3].includes(currentQuestion) && /(?:你刚才|刚才你|你前面|前面你).{0,18}(?:提到|说到|说了|说|表达)|(?:你提到的|你说的).{0,12}(?:想法|担心|感受|情况|反应)/.test(text)) {
    return true;
  }

  if ([1, 2, 3].includes(currentQuestion) && /^(?:嗯[，,。\s]*)?(?:明白了|知道了|好的)[。！!，,\s]*(?:那|接下来|当|你|这种|如果)/.test(text.trim())) {
    return true;
  }

  // Do not let Stage 3 turn a reported bodily/sleep experience into an
  // unsupported causal or clinical interpretation of the current emotion.
  if (currentQuestion === 2 && (
      /(?:失眠|睡不着|睡眠|心跳|呼吸|身体|外在表现).{0,16}(?:是|属于).{0,16}(?:情绪|无力感|焦虑|压力).{0,12}(?:反应)/.test(text) ||
      /(?:这|这也)?说明.{0,24}(?:情绪|压力|无力感|焦虑).{0,24}(?:影响到|影响了).{0,20}(?:身体|睡眠|休息|恢复)/.test(text)
    )) {
    return true;
  }

  return false;
}

function shouldRepairStage3Reply(text) {
  if (CONDITION !== 'emotion' || currentStage !== 3) return false;

  // A Stage-5 transfer/generalization question is never valid while Stage 3 is
  // active. Stage 3 must finish first, then the post emotion-awareness ratings
  // and post matrices must be completed before Stage 5 can begin.
  if (/(?:其他类似的经历|别的让你困扰或有压力的经历|任何让你困扰或者有压力的经历)/.test(text)) return true;

  if (text.includes('我们再来评估一下')) return false;
  if (stage3AcknowledgementNeedsRepair(text)) return true;

  const asked = classifyStage3Question(text);

  // The one Stage-3 body/expressive question should invite the participant to
  // pause and recall concrete bodily/sleep/voice changes, rather than ending with
  // the generic “如果愿意，可以尽量具体地说说”.
  if (asked === 'BODY' && /如果愿意/.test(text)) return true;

  // When an emotion is being opened, the first cognition question must be preceded
  // by a brief context-sensitive empathic lead-in. For multiple selected emotions,
  // the initial "which one first?" question is still allowed without this lead-in.
  if (currentQuestion === 0 && asked === 'COG' && !stage3OpeningHasEmpathicLeadIn(text)) {
    return true;
  }

  // For the first three steps, the next category is deterministic. Repair not only
  // missing questions but also repeated/out-of-order questions (e.g. ACTION twice).
  if ([1, 2, 3].includes(currentQuestion)) {
    const expected = expectedStage3NextQuestion();
    return asked !== expected;
  }

  // Once CONTEXT has been answered, the current emotion is complete. The model must
  // never return to BODY/ACTION/CONTEXT for that same emotion. If it starts the next
  // emotion, it must explicitly transition and restart at COG.
  if (currentQuestion === 4) {
    if (asked === 'BODY' || asked === 'ACTION' || asked === 'CONTEXT') return true;
    if (asked === 'COG' && !text.includes('接下来我们来聊聊')) return true;
    if (text.includes('接下来我们来聊聊') && asked !== 'COG') return true;
  }

  return false;
}

function getStage3RepairInstruction() {
  let stateRule = '';
  if (currentQuestion === 0) {
    stateRule = '现在正在开始探索一个用户已经选择好的情绪。如果已经确定了要先聊哪个情绪，先用“我们来聊聊XX。”自然进入，然后必须先用1-2句结合用户具体经历的共情和情境重述，让用户感到这段处境被真正听见和理解；可以采用旧版“听起来你在面对……时感受到这种情绪。像这样的感受确实不容易承受……”的语气，但必须根据当前事件自然改写。完成这个共情开场后，再提出当前结构中的第一个认知问题，并在末尾加[[S3_COG]]。不要改变认知问题的目标和结构，也不要给建议、诊断或隐藏原因分析。';
  } else if (currentQuestion === 1) {
    stateRule = stage3BodyQuestionAsked
      ? '用户刚刚已经回答了当前情绪的认知问题。下一步只能进入行为/动机问题，不要再问认知，也不要再问身体/外在表现。'
      : '用户刚刚已经回答了当前情绪的认知问题。下一步只能询问整个阶段3唯一一次的整体身体/外在表现问题，不要重复认知问题。';
  } else if (currentQuestion === 2) {
    stateRule = '用户刚刚已经回答了整体身体/外在表现问题。下一步只能进入当前情绪的行为/动机问题，不要再问身体，也不要回到认知。';
  } else if (currentQuestion === 3) {
    stateRule = '用户刚刚已经回答了当前情绪的行为/动机问题。下一步只能进入具体情境问题。绝对不要换一种说法再次询问想做什么、想说什么或想避开什么。';
  } else if (currentQuestion === 4) {
    stateRule = '用户刚刚已经回答了当前情绪的具体情境问题，因此这个情绪的探索已经完成。像“在看到同事都做得比我好的时候”“在有很多事情要做的时候”这类简短的触发情境也算完整回答。绝对不要再问认知、身体/外在表现、行为/动机或具体情境，也不要要求用户把这个时刻再说具体一点。先总结这个情绪；如果还有阶段2已选择但未探索的情绪，用“接下来我们来聊聊XX。”过渡。开始新的情绪后，先用1句结合具体事件的共情和情境重述，再从该情绪的认知问题开始；不要从过渡语直接跳到提问。如果已全部完成，则按系统提示进入结束该阶段的逻辑。';
  }

}

function normalizeParticipantFacingParagraphs(text) {
  if (typeof text !== 'string') return text;
  let out = text;

  // Keep the second half of the another-event prompt as a visually separate paragraph.
  out = out.replace(/\s*如果有的话，能详细说说这件事吗？/g, '\n\n如果有的话，能详细说说这件事吗？');

  // Keep the optional-next-emotion question separate from the emotion summary.
  out = out.replace(/\s*(我们刚刚聊完了[^。！？!?\n]{0,30}。)?你还有其他关于这件事的感受或情绪想继续聊聊吗？/g, function(match, prefix) {
    return '\n\n' + (prefix || '') + '你还有其他关于这件事的感受或情绪想继续聊聊吗？';
  });

  // The closing line should always be its own paragraph.
  out = out.replace(/\s*本次对话到此结束。祝你工作顺利，也记得照顾好自己❤️/g, '\n\n本次对话到此结束。祝你工作顺利，也记得照顾好自己❤️');

  return out.replace(/\n{3,}/g, '\n\n').trim();
}

function shouldRepairFinalSummaryFormatting(text) {
  const summaryStage = CONDITION === 'emotion' ? 5 : 4;
  if (currentStage !== summaryStage || typeof text !== 'string') return false;
  if (!text.includes('本次对话到此结束')) return false;
  if (text.includes('如果你愿意')) return true;
  const paragraphs = text.split(/\n\s*\n/).map(function(p) { return p.trim(); }).filter(Boolean);
  return paragraphs.length < 3;
}

function getFinalSummaryFormattingRepairInstruction() {
  if (CONDITION === 'emotion') {
    return `请只重新生成最终总结，不要改变内容所依据的用户信息。格式必须严格为3个自然段，每两个段落之间保留一个完整空行：\n\n第1段：事件回顾、系统给出的困扰程度反馈原句，以及情绪识别/描述能力反馈。这里不要加入建议。\n\n第2段：只写1-2条具体、温和的自我支持建议，并直接从建议开始。不要使用“如果你愿意”，不要先写泛泛的过渡语，也不要使用项目符号。\n\n第3段：只写“本次对话到此结束。祝你工作顺利，也记得照顾好自己❤️”。\n\n保持自然对话语气，不要增加新的心理解释、诊断或用户没有提供的信息。`;
  }
  return `请只重新生成最终总结。格式必须严格为3个自然段，每两个段落之间保留一个完整空行：\n\n第1段：事件回顾和系统给出的困扰程度反馈原句，不要加入建议。\n\n第2段：只写基于用户实际饮食、睡眠和运动回答的生活状态反馈与1-2条建议，并直接从反馈/建议开始，不要使用项目符号。\n\n第3段：只写“本次对话到此结束。祝你工作顺利，也记得照顾好自己❤️”。\n\n不要增加用户没有提供的信息。`;
}

function sendToAI(messages) {
  const btn   = document.getElementById('chatSubmit');
  const input = document.getElementById('chatInput');
  btn.disabled = true; input.disabled = true;

  const log = document.getElementById('chatLog');
  const typingRow = document.createElement('div');
  typingRow.className = 'typing-row'; typingRow.id = 'typingIndicator';
  typingRow.innerHTML = '<div class="typing-label">小暖</div><div class="typing-bubble"><span></span><span></span><span></span></div>';
  log.appendChild(typingRow);
  log.scrollTop = log.scrollHeight;

  const callModel = (payloadMessages) => fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, messages: payloadMessages, temperature: 0.7 })
  }).then(r => r.json());

  callModel(messages)
  .then(async data => {
    if (!data.choices?.[0]) return { rawReply: null };

    let rawReply = data.choices[0].message.content;

    if (shouldRepairStage2EmotionFormat(rawReply)) {
      const repairMessages = messages.concat([
        { role: 'assistant', content: rawReply },
        { role: 'system', content: getStage2FormatRepairInstruction() }
      ]);
      try {
        const repaired = await callModel(repairMessages);
        if (repaired.choices?.[0]?.message?.content) {
          rawReply = repaired.choices[0].message.content;
        }
      } catch (repairErr) {
        console.warn('[Stage2 format repair]', repairErr);
      }
    }

    // If an intermediate emotion-reflection turn contains only acknowledgement and
    // forgets the next question, ask the model to regenerate the turn naturally.
    // This avoids inserting a canned JS fallback question.
    if (shouldRepairStage3Reply(rawReply)) {
      for (let attempt = 1; attempt <= 3 && shouldRepairStage3Reply(rawReply); attempt++) {
        const repairMessages = messages.concat([
          { role: 'assistant', content: rawReply },
          { role: 'system', content: getStage3RepairInstruction() }
        ]);
        try {
          const repaired = await callModel(repairMessages);
          if (repaired.choices?.[0]?.message?.content) {
            rawReply = repaired.choices[0].message.content;
          }
        } catch (repairErr) {
          console.warn('[Stage3 repair]', repairErr);
          break;
        }
      }
    }

    if (shouldRepairFinalSummaryFormatting(rawReply)) {
      for (let attempt = 1; attempt <= 2 && shouldRepairFinalSummaryFormatting(rawReply); attempt++) {
        const repairMessages = messages.concat([
          { role: 'assistant', content: rawReply },
          { role: 'system', content: getFinalSummaryFormattingRepairInstruction() }
        ]);
        try {
          const repaired = await callModel(repairMessages);
          if (repaired.choices?.[0]?.message?.content) {
            rawReply = repaired.choices[0].message.content;
          }
        } catch (repairErr) {
          console.warn('[Final summary formatting repair]', repairErr);
          break;
        }
      }
    }

    return { rawReply };
  })
  .then(({ rawReply }) => {
    document.getElementById('typingIndicator')?.remove();
    btn.disabled = false; input.disabled = false;

    if (rawReply) {
      rawReply = normalizeStage1RoutingReply(rawReply);
      rawReply = normalizeParticipantFacingParagraphs(rawReply);
      // Track state using the raw reply (including invisible Stage-3 markers),
      // but never show or store those markers in the participant-facing conversation.
      updateState(rawReply);
      const reply = stripStage3Markers(rawReply);
      s.push({ role: 'assistant', content: reply });
      appendMsg('ai', reply);
    } else {
      appendMsg('ai', '抱歉，出现了一点问题，请重试。');
    }
  })
  .catch(err => {
    document.getElementById('typingIndicator')?.remove();
    btn.disabled = false; input.disabled = false;
    console.error('[Proxy]', err);
    appendMsg('ai', '网络连接出现问题，请检查您的网络后重试。');
  });
}

function normalizeInitialStressorClassification(obj) {
  const hasStressor = ['yes', 'no', 'unclear'].includes(obj?.has_stressor)
    ? obj.has_stressor
    : 'unclear';
  return {
    has_stressor: hasStressor,
    specific_event_described: obj?.specific_event_described === true
  };
}

async function classifyInitialStressorTurn(text, phase) {
  const systemPrompt = `你是一个只用于研究问卷内部路由的中文语义分类器。你的任务是判断用户对“最近工作上有没有让你压力很大或困扰的事”这类问题的实际含义。不要生成聊天回复，也不要依赖固定关键词或特定句式，要根据整句话的语义判断。

只返回一个JSON对象，不要加解释、Markdown或其他文字：
{
  "has_stressor": "yes" | "no" | "unclear",
  "specific_event_described": true | false
}

字段含义：
- has_stressor：用户是否实际提到了任何工作上的压力、困扰、让人不舒服的经历、反复模式或具体事件。明确表示没有、最近没有、想不到任何这样的经历时判为no；如果用户确实描述了压力来源或困扰，即使很笼统，也判为yes；信息不足或语义矛盾时判为unclear。
- specific_event_described：用户是否已经描述了一件发生在相对明确时间点的具体事件经过，而不是笼统问题、长期状态或反复模式。只有同时有具体事件和足够的发生经过时才为true。

阶段说明：
- initial：用户刚回答“最近工作上有没有什么让你压力很大或困扰的事”。
- fallback：用户之前表示最近没有，因此现在回答的是“以前在工作中有没有哪件让你觉得有些困扰或压力的事”。

重要：
- “没有”“最近没有”“暂时想不到”“好像没有”应根据整体语义判断是否为no，不要因为问题期待一个事件就强行判为yes。
- 如果用户说“没有特别大的，但有一件……”并继续描述事情，则应判为yes。
- 不要推测用户没有明确说出的经历。`;

  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: MODEL,
      temperature: 0,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: JSON.stringify({ phase, user_text: String(text || '') }, null, 2) }
      ]
    })
  });

  if (!response.ok) throw new Error(`Initial stressor classifier HTTP ${response.status}`);
  const data = await response.json();
  const raw = data.choices?.[0]?.message?.content;
  if (!raw) throw new Error('Initial stressor classifier returned no content');
  const parsed = normalizeInitialStressorClassification(parseClassifierJson(raw));
  console.log('[Initial stressor classifier]', phase, '|', text, '|', parsed);
  return parsed;
}

async function safeClassifyInitialStressorTurn(text, phase) {
  showSemanticRoutingIndicator();
  try {
    return await classifyInitialStressorTurn(text, phase);
  } catch (err) {

    return { has_stressor: 'unclear', specific_event_described: false };
  } finally {
    hideSemanticRoutingIndicator();
  }
}

// Q2 exists only for genuinely interpersonal events. Non-interpersonal events skip

function q3ImpactTransition(impact) {

// Q5 uses the participant's own referent for the person they talked to.

// otherwise use the relationship they named (e.g. 同事、朋友、家人) instead of

let q5SupportReferent = '其他人';
let q5SupportPeople = [];
let q4ActualSupportConfirmed = false;
let q5FollowupMode = null; // 'actual_who', 'clarify_contact', 'actual_response', 'actual_help', 'hyp_response', 'hyp_help'

let q5HelpfulnessAlreadyDescribed = false;

function resetQ5RoutingState() {
  q5FollowupMode = null;

function setSupportPeople(people) {
  q5SupportPeople = Array.isArray(people)
    ? people.map(x => String(x || '').trim()).filter(Boolean)
    : [];

    q5SupportReferent = q5SupportPeople.join('和');

function mergeSupportPeople(people) {
  const merged = [...q5SupportPeople];
  for (const person of (Array.isArray(people) ? people : [])) {
    const clean = String(person || '').trim();
    if (clean && !merged.includes(clean)) merged.push(clean);
  }
  setSupportPeople(merged);
}

function supportReferentIsMultiple(ref) {
  return q5SupportPeople.length >= 2 || /(?:和|、)/.test(String(ref || ''));
}

function q5ResponseQuestion() {
  return supportReferentIsMultiple(q5SupportReferent)
    ? `${q5SupportReferent}当时分别是怎么回应你的？`
    : `${q5SupportReferent}当时是怎么回应你的？`;
}

function q5HelpfulQuestion() {
  return supportReferentIsMultiple(q5SupportReferent)
    ? '这些回应对你有帮助吗？'

}

function q5HypotheticalResponseQuestion() {

function parseClassifierJson(raw) {
  const cleaned = String(raw || '')
    .replace(/^```(?:json)?\s*/i, '')
    .replace(/\s*```$/i, '')
    .trim();

  try {
    return JSON.parse(cleaned);
  } catch (e) {
    const first = cleaned.indexOf('{');
    const last = cleaned.lastIndexOf('}');
    if (first >= 0 && last > first) {
      return JSON.parse(cleaned.slice(first, last + 1));
    }
    throw e;
  }
}

function normalizeSocialSupportClassification(obj) {
  const shared = ['yes', 'no', 'unclear'].includes(obj?.shared) ? obj.shared : 'unclear';
  const people = Array.isArray(obj?.people)
    ? obj.people.map(x => String(x || '').trim()).filter(Boolean)
    : [];

  return {
    shared,
    people,
    response_described: obj?.response_described === true,
    helpfulness_described: obj?.helpfulness_described === true,
    clearly_unhelpful_response: obj?.clearly_unhelpful_response === true
  };
}

async function classifySocialSupportTurn(text, phase, knownPeople = []) {
  const systemPrompt = `你是一个只用于研究问卷内部路由的中文语义分类器。你的任务是判断用户一句自然中文回答的实际含义，而不是生成聊天回复。不要依赖固定关键词或特定句式，要根据整句话、否定、时态、人物关系和上下文做语义判断。

只返回一个JSON对象，不要加解释、Markdown或其他文字：
{
  "shared": "yes" | "no" | "unclear",
  "people": ["用户明确提到的交流对象1", "对象2"],
  "response_described": true | false,
  "helpfulness_described": true | false,
  "clearly_unhelpful_response": true | false
}

字段含义：
- shared：用户是否实际和其他人聊过这件事。只根据实际发生的交流判断；假设、打算、想过但没做不算yes。
- people：只记录用户明确提到的交流对象，尽量保留用户自己的称呼；如果提到多人，全部保留；没有明确提到则返回空数组。绝对不要猜测人物。
- response_described：用户是否已经描述了交流对象实际或假设会如何回应。仅仅说自己“和某人聊过/说过”不算描述了对方回应。
- helpfulness_described：用户是否已经明确表达这些回应对自己有没有帮助、有没有让情况更好/更糟。不要把“安慰了我”“听我说了”“给了建议”等积极或中性的回应内容自动当成用户已经评价了帮助程度。
- clearly_unhelpful_response：只有当回应本身已经明确表达不理解、拒绝、责怪、否定、嘲讽、忽视、发火、让情况更糟等明显负面的反应，以至于继续追问“这样的回应会有帮助吗”在日常对话中会显得突兀、反问或讽刺时，才设为true。普通的“安慰了我”“听我说了”“给了建议”等不能设为true，因为这些回应是否真的有帮助仍需由用户判断。

Q5的帮助程度问题需要根据语义自然地使用：如果回应是积极、中性或效果不明确，就明确询问是否有帮助；如果用户已经明确评价了帮助程度，或者回应本身已经明显属于上述 clearly_unhelpful_response，则不要再机械追问“有帮助吗”。

不同阶段的注意事项：
- q4：重点判断有没有实际聊过、和谁聊过，以及同一句中是否已经包含对方回应或帮助程度。
- who：已知用户之前确认聊过；重点从当前回答中识别交流对象，不要因为当前回答没有再次出现“聊过”就改判为no。
- actual_response：已知实际交流已经发生；重点判断当前回答是否描述了对方回应，以及是否同时说明回应有没有帮助。
- hypothetical_response：用户此前没有实际聊过；重点判断当前回答是否给出了一个假设回应，以及是否同时评价了这个假设回应有没有帮助。如果用户只是说不知道、无法想象或没有给出任何回应内容，则response_described=false。
- clarify：重新根据当前回答判断是否实际聊过；如果确认聊过，也提取所有明确人物。

保持保守：信息不够就用unclear或false，不要补充用户没说过的内容。`;

  const userPayload = {
    phase,
    known_people: Array.isArray(knownPeople) ? knownPeople : [],
    user_text: String(text || '')
  };

  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: MODEL,
      temperature: 0,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: JSON.stringify(userPayload, null, 2) }
      ]
    })
  });

  if (!response.ok) throw new Error(`Semantic classifier HTTP ${response.status}`);
  const data = await response.json();
  const raw = data.choices?.[0]?.message?.content;
  if (!raw) throw new Error('Semantic classifier returned no content');

  const parsed = normalizeSocialSupportClassification(parseClassifierJson(raw));
  console.log('[Social support classifier]', phase, '|', text, '|', parsed);
  return parsed;
}

function normalizeDirectCommunicationClassification(obj) {
  const communication = ['yes', 'no', 'unclear'].includes(obj?.communication)
    ? obj.communication
    : 'unclear';
  const responseEffect = ['helpful', 'unhelpful', 'mixed', 'unclear'].includes(obj?.response_effect)
    ? obj.response_effect
    : 'unclear';

  return {
    communication,
    barrier: obj?.barrier === true,
    communication_details_described: obj?.communication_details_described === true,
    response_described: obj?.response_described === true,
    response_effect: responseEffect
  };
}

async function classifyDirectCommunicationTurn(text, phase) {
  const systemPrompt = `你是一个只用于研究问卷内部路由的中文语义分类器。你的任务是根据用户整句话的实际含义，判断“与事件中直接相关的对方沟通”这一部分目前已经发生了什么。你不是聊天机器人，不要生成回复，也不要依赖固定关键词、正则表达式或特定句式。

只返回一个JSON对象，不要加解释、Markdown或其他文字：
{
  "communication": "yes" | "no" | "unclear",
  "barrier": true | false,
  "communication_details_described": true | false,
  "response_described": true | false,
  "response_effect": "helpful" | "unhelpful" | "mixed" | "unclear"
}

字段含义：
- communication：用户是否【实际已经】和事件中直接相关的对方沟通过。根据当前问题的上下文理解简短回答；如果用户明确肯定沟通过，即使没有再次说“沟通”这个词，也应判为yes。假设、打算、想过但没做不算yes。
- barrier：用户是否表达了沟通本身基本无法进行、没有现实可行性，或认为根本无法形成有效沟通。单纯“没有沟通”不等于barrier。
- communication_details_described：用户是否提供了任何实际沟通的具体内容或过程，而不只是一个简短的“有/试过”。如果同一句已经描述了对方的反应，也算提供了实际沟通细节。
- response_described：用户是否已经描述了对方实际或假设的回应、态度、反应或立场。不要要求必须是完整引语；“对方不理解”“对方还是坚持原来的看法”这类内容也属于回应。
- response_effect：只有在回应对处理当时情况的作用已经很清楚时才判断。明确理解、配合、接受等可判helpful；明确不理解、不听、拒绝、发火、忽视、使事情更难等可判unhelpful；同时有帮助和困难可判mixed；信息不足则unclear。不要凭空推断。

不同阶段：
- q2：刚刚问的是“你当时有没有尝试和对方沟通过你的想法？”。重点判断实际沟通是否发生，以及同一句里是否已经包含沟通细节或对方回应。特别注意：如果回答先肯定“有/有的/试过”等，再描述对方态度或反应，这表示实际沟通已经发生，绝不能进入假设性分支。
- q2_details：前一轮已经确认实际沟通过。当前回答即使没有再次出现“沟通/说过”等词，也要在这个已知前提下判断它是否包含沟通细节或对方回应；不要因为当前句子省略主语或动词而改判为no。
- actual_response：已知实际沟通已经发生。重点判断当前回答是否已经描述对方实际回应，以及回应的作用是否已经明显。
- hypothetical_response：已知此前没有实际沟通，现在用户是在回答“如果沟通，对方可能会怎么回应”。重点判断是否给出了一个假设回应。如果用户拒绝这个假设前提、表示根本无法沟通或无法想象有效沟通，可设barrier=true。

保持保守：不确定就用unclear或false，但绝不能把已经明确发生的实际沟通错误改成假设沟通。`;

  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: MODEL,
      temperature: 0,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: JSON.stringify({ phase, user_text: String(text || '') }, null, 2) }
      ]
    })
  });

  if (!response.ok) throw new Error(`Direct communication classifier HTTP ${response.status}`);
  const data = await response.json();
  const raw = data.choices?.[0]?.message?.content;
  if (!raw) throw new Error('Direct communication classifier returned no content');

  const parsed = normalizeDirectCommunicationClassification(parseClassifierJson(raw));
  console.log('[Direct communication classifier]', phase, '|', text, '|', parsed);
  return parsed;
}

// Detect when the participant explicitly says there is NO additional/similar event.
// In that case the transfer task is not applicable: do not ask ratings about a
// nonexistent event and do not ask for emotions about it.
function anotherEventAbsentDetected(text) {
  const t = String(text || '').trim().replace(/[。！？!?，,；;\s]+/g, '');
  if (!t) return false;

  // Clear negative answers commonly used in natural Chinese.
  const clearNegatives = [
    '没有', '没有了', '没了', '暂时没有', '目前没有', '最近没有', '以前没有',
    '好像没有', '似乎没有', '应该没有', '没有类似的', '没有类似经历',
    '没有其他的', '没有其他', '没遇到过', '没有遇到过', '没碰到过',
    '想不到', '想不起来', '暂时想不到', '暂时想不起来', '没有想到'
  ];
  if (clearNegatives.includes(t)) return true;

  // Slightly longer explicit negatives, while avoiding phrases such as
  // “没有很大事，但是有……” that actually introduce another event.
  const hasPositiveContinuation = /(但是|但|不过|可是|有一次|有个|有件|倒是有|其实有|后来有)/.test(t);
  if (hasPositiveContinuation) return false;

  return /^(没有|没|暂时没有|目前没有|最近没有|好像没有|似乎没有|应该没有).*(类似|其他|别的|经历|事情|事)?$/.test(t) ||
         /^(想不到|想不起来|没想起来)/.test(t);
}

function getDistressFeedbackSentence() {
  const pre = scales.distress_level_1;

  if (pre == null || post == null) return '';
  if (post < pre) {

  }

}
