  s.push({
    role: 'system',
    content: `【最终总结中的困扰程度反馈，必须逐字使用】前测困扰程度=${scales.distress_level_1}；后测困扰程度=${scales.distress_level_2}。在最终总结中，关于困扰程度只允许使用下面这一句，不得改写、不得解释原因、不得添加“这很正常”“感受更清晰/更强烈”“这是好的迹象”等推断：${exactDistressFeedback}`
  });
}

async function submitResponse(text) {
  userMsgCount++;
  // Capture response to whichever question was last asked. Keep the field name
  // locally so we can launch the another-event scales immediately afterward.
  const capturedField = pendingCapture;
  if (pendingCapture && !text.startsWith('量表已完成')) {
    // Store exactly what the USER entered for the question being captured.
    // For selected_emotions this is intentionally the user's selection/own emotion text,
    // never the AI's candidate emotion list.
    textData[pendingCapture] = text;
    if (pendingCapture === 'another_emotion') stageTimes.another_end = new Date();
    if (pendingCapture === 'selected_emotions') {
      console.log('[Capture] selected_emotions =', textData.selected_emotions);
      // Persist the user's ACTUAL selection in the model context. The emotions
      // suggested by the assistant in Stage 2 are candidates only and must never
      // be treated as selected unless the user explicitly named/endorsed them.
      s.push({
        role: 'system',
        content: `【阶段2实际情绪选择，必须严格遵守】用户对情绪选择问题的原始回答是：${textData.selected_emotions}。阶段3只能探索用户在这条回答中明确选择、说出或认可的情绪。绝对不要把阶段2由助手建议、但用户没有选择的任何情绪当成“其他已选择情绪”。如果用户这里只明确选择了一个情绪，那么探索完这个情绪后，不得说“接下来聊其他可能感受到的情绪”或询问“还想先聊哪一个”；只能按单一情绪完成后的逻辑，询问用户是否还有其他关于这件事的感受或情绪想继续聊。`
      });
      if (CONDITION === 'emotion') {
        currentStage = 3;
        currentQuestion = 0;
        s.push({
          role: 'system',
          content: '【当前流程状态：阶段3情绪探索】用户刚刚已经完成阶段2的情绪选择。下一条助手回复必须从阶段3开始，只探索用户实际选择的情绪。若用户只选择了一个情绪，开始该情绪时必须先用“我们来聊聊[情绪]”进入，再用1-2句结合其具体经历的共情和情境重述，让用户先感到被听见和理解，然后才提出当前结构中的第一个认知问题；不得直接从“我们来聊聊[情绪]”跳到提问。若用户选择了多个情绪，先按阶段3规则让用户选择从哪一个开始；用户选定后，同样先做上述共情开场，再进入认知问题。不得跳到阶段4或阶段5。'
        });
      }
    }
    pendingCapture = null;
  }

  s.push({ role: 'user', content: text });
  appendMsg('user', text);
  parseAndSaveScale(text);

  // Final summary: compute the distress comparison deterministically from the stored
  // pre/post ratings. This prevents the model from saying the score increased when
  // the two ratings are actually equal (or otherwise misreading the direction).
  if (capturedField === 'another_emotion') {
    injectFinalSummaryDistressRule();
  }
  if (leasAsked && !leasResponse) {
    leasResponse = text;
    console.log('[LEAS] Response captured:', leasResponse.substring(0, 80));
  }

  if (CONDITION === 'emotion' && currentStage === 3 && currentQuestion === 4 && stage3ContextAnswerIsSufficient(text)) {
    s.push({
      role: 'system',
      content: `【阶段3具体情境已回答完成】用户刚刚已经给出了当前情绪的具体时刻、条件或触发情境：${text}。即使回答只有一句或一个“在……的时候”的短语，也必须视为这一部分已经完成。不要再次询问什么时候最明显、当时发生了什么、能否更具体，也不要围绕这个触发情境追加追问。现在按阶段3规则直接总结当前情绪，并进入下一个已选择情绪或该阶段的结束逻辑。`
    });
  }

  // Save snapshot on every user response (overwrites same Lark row)
  saveToLark();

  // Route the opening stressor question semantically. A clear “no” must never be
  // turned into “please give a specific example.” Ask one neutral past-event fallback;
  // if the participant still reports no relevant work experience, end this event-based flow.
  if (currentStage === 1 && currentQuestion === 0 && capturedField === 'stress_event') {
    const phase = initialStressorFallbackAsked ? 'fallback' : 'initial';
    const cls = await safeClassifyInitialStressorTurn(text, phase);
    let nextQ = null;

    if (cls.has_stressor === 'yes') {
      nextQ = cls.specific_event_described ? SPECIFIC_EVENT_PROMPT_B : SPECIFIC_EVENT_PROMPT_A;
      pendingCapture = 'specific_event';
    } else if (cls.has_stressor === 'no') {
      if (!initialStressorFallbackAsked) {
        initialStressorFallbackAsked = true;
        nextQ = INITIAL_STRESSOR_FALLBACK;
        pendingCapture = 'stress_event';
      } else {
        nextQ = INITIAL_STRESSOR_END;
      }
    } else {
      nextQ = INITIAL_STRESSOR_CLARIFY;
      pendingCapture = 'stress_event';
    }

    setTimeout(function() {
      s.push({ role: 'assistant', content: nextQ });
      appendMsg('ai', nextQ);
      if (nextQ === INITIAL_STRESSOR_END) {
        setTimeout(showContinueButton, 600);
      } else {
        updateState(nextQ);
      }
    }, 300);
    return;
  }

  // The participant has now answered the one allowed concrete-event prompt.
  // Treat Q1 as complete and explicitly tell the model to move on, so it cannot
  // ask "能详细说说这件事吗" a second time just because some optional details
  // such as location or every person present were not mentioned.
  if (currentStage === 1 && capturedField === 'specific_event') {
    currentQuestion = 1;
    s.push({
      role: 'system',
      content: '【阶段1 Q1已完成】用户刚刚已经回答了具体事件提问。不要再次询问“可以举个具体的例子吗”“能详细说说这件事吗”，也不要把时间、地点、在场人物当成必须逐项补齐的清单。现在直接根据这件事的核心性质判断：如果确实存在自然的直接沟通对象，进入Q2；如果核心困难来自工作量、制度、资源、绩效、政策、不确定性等而没有自然的“对方”，完全跳过Q2/Q3并直接进入Q4。'
    });
    sendToAI(s);
    return;
  }

  // Transfer/generalization measure. If the participant explicitly says there is
  // no other similar event, the transfer task is not applicable. Skip all four
  // _another ratings AND the another_emotion question, and go straight to the
  // final summary. Only a real additional event should launch these measures.
  if (capturedField === 'another_event') {
    if (anotherEventAbsentDetected(text)) {
      console.log('[Another event] None reported; skipping transfer measures.');
      anotherScaleActive = false;
      anotherScaleQuestion = 0;
      textData.another_emotion = '';
      injectFinalSummaryDistressRule();
      s.push({
        role: 'system',
        content: '【没有其他类似经历：立即结束迁移测量】用户刚刚明确表示没有其他类似经历。不要追问原因，不要生成任何“想到这件事……”的评分题，不要问“在这件事中有什么感受或情绪”。这些题对此用户不适用。现在直接按照系统提示进行最后总结与结束；总结围绕用户最初讨论的事件和本次对话，不得假设存在第二件经历。'
      });
      sendToAI(s);
      return;
    }
    startAnotherScales();
    return;
  }
  if (anotherScaleActive) {
    if (anotherScaleQuestion < 4) {
      anotherScaleQuestion += 1;
      const nextAnotherQ = anotherScaleQuestion;
      setTimeout(function() { showAnotherScaleQuestion(nextAnotherQ); }, 500);
    } else {
      finishAnotherScales();
    }
    return;
  }

  // Deliver next scale question instantly without API call
  const postScaleStage = CONDITION === 'emotion' ? 4 : 3;

  // Q3 is a two-step sequence. Semantic classification is used so natural
  // Chinese responses are interpreted by meaning rather than by fixed word lists.
  if (currentStage === 1 && currentQuestion === 3 && q3FollowupMode) {
    let nextQ = null;

    if (q3FollowupMode === 'actual_response') {
      const cls = await safeClassifyDirectCommunicationTurn(text, 'actual_response');

      if (cls.response_described) {
        if (cls.response_effect !== 'unclear') {
          nextQ = q3ImpactTransition(cls.response_effect);
          q3FollowupMode = null;
        } else {
          nextQ = Q3_HELPFUL;
          q3FollowupMode = 'actual_help';
        }
      } else if (cls.barrier) {
        nextQ = Q3_COMMUNICATION_BARRIER_TRANSITION;
        q3FollowupMode = null;
      } else {
        nextQ = Q3_RESPONSE;
        q3FollowupMode = 'actual_response';
      }

    } else if (q3FollowupMode === 'hyp_response') {
      const cls = await safeClassifyDirectCommunicationTurn(text, 'hypothetical_response');

      if (cls.barrier) {
        nextQ = Q3_COMMUNICATION_BARRIER_TRANSITION;
        q3FollowupMode = null;
      } else if (cls.response_described) {
        if (cls.response_effect !== 'unclear') {
          nextQ = q3ImpactTransition(cls.response_effect);
          q3FollowupMode = null;
        } else {
          nextQ = Q3_HYPOTHETICAL_HELPFUL;
          q3FollowupMode = 'hyp_help';
        }
      } else {
        nextQ = Q4_DIRECT;
        q3FollowupMode = null;
      }

    } else if (q3FollowupMode === 'actual_help' || q3FollowupMode === 'hyp_help') {
      q3FollowupMode = null;
      nextQ = Q4_DIRECT;
    }

    if (nextQ) {
      setTimeout(function() {
        s.push({ role: 'assistant', content: nextQ });
        appendMsg('ai', nextQ);
        updateState(nextQ);
      }, 700);
      return;
    }
  }

  // Q2 is asked only for genuinely interpersonal events. Route the user's
  // answer by semantic meaning so actual communication is never turned into a
  // hypothetical scenario simply because the wording is short or conversational.
  if (currentStage === 1 && currentQuestion === 2) {
    const phase = q2ActualCommunicationConfirmed ? 'q2_details' : 'q2';
    const cls = await safeClassifyDirectCommunicationTurn(text, phase);
    console.log('[Q2 semantic route]', phase, '|', cls);

    let q3 = null;

    if (q2ActualCommunicationConfirmed) {
      // The previous turn already established that real communication happened.
      // Interpret this turn within that fact, even if the user only describes the
      // other person's reaction and does not repeat the communication verb.
      if (cls.response_described) {
        if (cls.response_effect !== 'unclear') {
          q3 = q3ImpactTransition(cls.response_effect);
          q3FollowupMode = null;
        } else {
          q3 = Q3_HELPFUL;
          q3FollowupMode = 'actual_help';
        }
      } else {
        q3 = Q3_RESPONSE;
        q3FollowupMode = 'actual_response';
      }
      q2ActualCommunicationConfirmed = false;

    } else if (cls.communication === 'yes') {
      // A clear affirmative answer means actual communication happened. Never ask
      // “如果当时和对方沟通...” after this branch.
      if (!cls.communication_details_described && !cls.response_described) {
        q2ActualCommunicationConfirmed = true;
        setTimeout(function() {
          s.push({ role: 'assistant', content: Q2_DETAILS });
          appendMsg('ai', Q2_DETAILS);
        }, 700);
        return;
      }

      if (cls.response_described) {
        if (cls.response_effect !== 'unclear') {
          q3 = q3ImpactTransition(cls.response_effect);
          q3FollowupMode = null;
        } else {
          q3 = Q3_HELPFUL;
          q3FollowupMode = 'actual_help';
        }
      } else {
        q3 = Q3_RESPONSE;
        q3FollowupMode = 'actual_response';
      }

    } else if (cls.barrier) {
      q3 = Q3_COMMUNICATION_BARRIER_TRANSITION;
      q3FollowupMode = null;

    } else if (cls.communication === 'no') {
      q3 = Q3_HYPOTHETICAL_RESPONSE;
      q3FollowupMode = 'hyp_response';

    } else {
      // If the meaning is genuinely ambiguous, clarify the factual state instead of
      // guessing that no communication happened and launching a hypothetical branch.
      q3 = Q2_CLARIFY;
      q3FollowupMode = null;
    }

    setTimeout(function() {
      s.push({ role: 'assistant', content: q3 });
      appendMsg('ai', q3);
      updateState(q3);
    }, 700);
    return;
  }

  // After Q4, use semantic classification rather than keyword matching.
  if (currentStage === 1 && currentQuestion === 4) {
    const cls = await safeClassifySocialSupportTurn(text, 'q4', []);
    let q5;

    setSupportPeople(cls.people);
    q5ResponseAlreadyDescribed = cls.response_described;
    q5HelpfulnessAlreadyDescribed = cls.helpfulness_described;
    q5ClearlyUnhelpfulResponse = cls.clearly_unhelpful_response;

    if (cls.shared === 'no') {
      q4ActualSupportConfirmed = false;
      q5FollowupMode = 'hyp_response';
      q5 = q5HypotheticalResponseQuestion();
    } else if (cls.shared === 'yes') {
      q4ActualSupportConfirmed = true;

      if (q5SupportPeople.length === 0) {
        q5FollowupMode = 'actual_who';
        q5 = '是和谁聊的呢？';
      } else if (q5ResponseAlreadyDescribed) {
        if (q5HelpfulnessAlreadyDescribed || q5ClearlyUnhelpfulResponse) {
          q5 = SCALE_Q[7];
          resetQ5RoutingState();
        } else {
          q5FollowupMode = 'actual_help';
          q5 = q5HelpfulQuestion();
        }
      } else {
        q5FollowupMode = 'actual_response';
        q5 = q5ResponseQuestion();
      }
    } else {
      q4ActualSupportConfirmed = false;
      q5FollowupMode = 'clarify_contact';
      q5 = '你是说后来有跟别人聊过这件事，还是没有聊过呢？';
    }

    // From this point onward the participant is answering Q5. Set the state
    // explicitly instead of inferring it from the wording of the generated question.
    // This keeps the routing stable for natural variants such as "是和谁聊的呢？"
    // or multi-person wording such as "家人和朋友当时分别是怎么回应你的？".
    currentQuestion = 5;

    setTimeout(function() {
      s.push({ role: 'assistant', content: q5 });
      appendMsg('ai', q5);
      updateState(q5);
    }, 300);
    return;
  }

  // Q5 stays structurally fixed, but semantic classification determines what the
  // participant has already conveyed so we do not repeat or invent information.
  if (currentStage === 1 && currentQuestion === 5) {
    let nextQ;

    if (q5FollowupMode === 'actual_who') {
      const cls = await safeClassifySocialSupportTurn(text, 'who', q5SupportPeople);
      mergeSupportPeople(cls.people);
      q5ResponseAlreadyDescribed = q5ResponseAlreadyDescribed || cls.response_described;
      q5HelpfulnessAlreadyDescribed = q5HelpfulnessAlreadyDescribed || cls.helpfulness_described;
      q5ClearlyUnhelpfulResponse = q5ClearlyUnhelpfulResponse || cls.clearly_unhelpful_response;
      q4ActualSupportConfirmed = true;

      if (q5SupportPeople.length === 0) {
        nextQ = '是和谁聊的呢？';
        q5FollowupMode = 'actual_who';
      } else if (q5ResponseAlreadyDescribed) {
        if (q5HelpfulnessAlreadyDescribed || q5ClearlyUnhelpfulResponse) {
          nextQ = SCALE_Q[7];
          resetQ5RoutingState();
        } else {
          nextQ = q5HelpfulQuestion();
          q5FollowupMode = 'actual_help';
        }
      } else {
        nextQ = q5ResponseQuestion();
        q5FollowupMode = 'actual_response';
      }
    } else if (q5FollowupMode === 'clarify_contact') {
      const cls = await safeClassifySocialSupportTurn(text, 'clarify', q5SupportPeople);
      mergeSupportPeople(cls.people);
      q5ResponseAlreadyDescribed = cls.response_described;
      q5HelpfulnessAlreadyDescribed = cls.helpfulness_described;
      q5ClearlyUnhelpfulResponse = cls.clearly_unhelpful_response;

      if (cls.shared === 'yes') {
        q4ActualSupportConfirmed = true;
        if (q5SupportPeople.length === 0) {
          nextQ = '是和谁聊的呢？';
          q5FollowupMode = 'actual_who';
        } else if (q5ResponseAlreadyDescribed) {
          if (q5HelpfulnessAlreadyDescribed || q5ClearlyUnhelpfulResponse) {
            nextQ = SCALE_Q[7];
            resetQ5RoutingState();
          } else {
            nextQ = q5HelpfulQuestion();
            q5FollowupMode = 'actual_help';
          }
        } else {
          nextQ = q5ResponseQuestion();
          q5FollowupMode = 'actual_response';
        }
      } else if (cls.shared === 'no') {
        q4ActualSupportConfirmed = false;
        nextQ = q5HypotheticalResponseQuestion();
        q5FollowupMode = 'hyp_response';
      } else {
        nextQ = '你是说后来有跟别人聊过这件事，还是没有聊过呢？';
        q5FollowupMode = 'clarify_contact';
      }
    } else if (q5FollowupMode === 'actual_response') {
      const cls = await safeClassifySocialSupportTurn(text, 'actual_response', q5SupportPeople);
      mergeSupportPeople(cls.people);
      q5ResponseAlreadyDescribed = q5ResponseAlreadyDescribed || cls.response_described;
      q5HelpfulnessAlreadyDescribed = q5HelpfulnessAlreadyDescribed || cls.helpfulness_described;
      q5ClearlyUnhelpfulResponse = q5ClearlyUnhelpfulResponse || cls.clearly_unhelpful_response;

      // The participant was directly asked for the other person's response. If they
      // cannot or do not provide one, do not keep probing; move on.
      if (!q5ResponseAlreadyDescribed) {
        nextQ = SCALE_Q[7];
        q5FollowupMode = null;
        q4ActualSupportConfirmed = false;
      } else if (q5HelpfulnessAlreadyDescribed || q5ClearlyUnhelpfulResponse) {
        nextQ = SCALE_Q[7];
        resetQ5RoutingState();
      } else {
        nextQ = q5HelpfulQuestion();
        q5FollowupMode = 'actual_help';
      }
    } else if (q5FollowupMode === 'actual_help') {
      nextQ = SCALE_Q[7];
      resetQ5RoutingState();
    } else if (q5FollowupMode === 'hyp_response') {
      const cls = await safeClassifySocialSupportTurn(text, 'hypothetical_response', q5SupportPeople);
      q5ResponseAlreadyDescribed = cls.response_described;
      q5HelpfulnessAlreadyDescribed = cls.helpfulness_described;
      q5ClearlyUnhelpfulResponse = cls.clearly_unhelpful_response;

      if (!q5ResponseAlreadyDescribed) {
        nextQ = SCALE_Q[7];
        q5FollowupMode = null;
      } else if (q5HelpfulnessAlreadyDescribed || q5ClearlyUnhelpfulResponse) {
        nextQ = SCALE_Q[7];
        resetQ5RoutingState();
      } else {
        nextQ = Q5_HYPOTHETICAL_HELPFUL;
        q5FollowupMode = 'hyp_help';
      }
    } else if (q5FollowupMode === 'hyp_help') {
      nextQ = SCALE_Q[7];
      resetQ5RoutingState();
    } else if (q4ActualSupportConfirmed) {
      nextQ = q5HelpfulQuestion();
      q5FollowupMode = 'actual_help';
    } else {
      nextQ = SCALE_Q[7];
    }

    setTimeout(function() {
      s.push({ role: 'assistant', content: nextQ });
      appendMsg('ai', nextQ);
      updateState(nextQ);
    }, 300);
    return;
  }

  if (currentStage === 1 && currentQuestion >= 7 && currentQuestion < 11) {
    const nextQ = SCALE_Q[currentQuestion + 1];  // Q8-Q11 from SCALE_Q
    if (nextQ) {
      setTimeout(function() {
        s.push({ role: 'assistant', content: nextQ });
        appendMsg('ai', nextQ);
        updateState(nextQ);
      }, 600);
      return;
    }
  }
  if (currentStage === postScaleStage && currentQuestion >= 1 && currentQuestion < 5) {
    const nextQ = POST_SCALE_Q[currentQuestion + 1];
    if (nextQ) {
      setTimeout(function() {
        s.push({ role: 'assistant', content: nextQ });
        appendMsg('ai', nextQ);
        updateState(nextQ);
      }, 600);
      return;
    }
  }

  // After the fifth post emotion-awareness rating, parseAndSaveScale() has already
  // scheduled the post anxiety/stress matrices. Do not ask the model for another
  // reply here, or it can jump to Stage 5 before those matrices are completed.
  if (currentStage === postScaleStage && currentQuestion === 5) {
    saveToLark();
    return;
  }

  // Save after every user response (overwrite mode)
  saveToLark();

  sendToAI(s);
}

function handleSend() {
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = '42px';
  submitResponse(text);
}

// Returns true if the AI message contains a 1-7 scale
function isScaleMessage(text) {
  return text.includes('1 ○○○○○○○');
}

// Strip scale lines from display text, extract anchor labels
function parseScaleMessage(text) {
  const lines = text.split('\n');
  const leftLine  = lines.find(l => /^1 ○/.test(l));
  const rightLine = lines.find(l => /^7 ●/.test(l));
  const leftLabel  = leftLine  ? leftLine.replace(/^1 [○● ]+/, '').trim() : '';
  const rightLabel = rightLine ? rightLine.replace(/^7 [○● ]+/, '').trim() : '';
  const cleanLines = lines.filter(l =>
    !/^[1-7] [○● ]/.test(l) &&
    !/^请在1-7中选择/.test(l)
  );
  return { cleanText: cleanLines.join('\n').trim(), leftLabel, rightLabel };
}

// Build and attach interactive 1-7 scale widget to a bubble element
function renderScaleWidget(bubble, leftLabel, rightLabel) {
  const widget = document.createElement('div');
  widget.className = 'scale-widget';
  const hintDiv = document.createElement('div');
  hintDiv.className = 'scale-hint';
  hintDiv.textContent = '点击数字选择';
  const labelsDiv = document.createElement('div');
  labelsDiv.className = 'scale-labels';
  const lSpan = document.createElement('span'); lSpan.textContent = leftLabel;
  const rSpan = document.createElement('span'); rSpan.textContent = rightLabel;
  labelsDiv.appendChild(lSpan);
  labelsDiv.appendChild(rSpan);
  const optsDiv = document.createElement('div');
  optsDiv.className = 'scale-options';
  for (let i = 1; i <= 7; i++) {
    const btn = document.createElement('button');
    btn.className = 'scale-opt';
    btn.textContent = i;
    btn.addEventListener('click', (function(val, b) {
      return function() {
        optsDiv.querySelectorAll('.scale-opt').forEach(x => { x.disabled = true; x.classList.remove('selected'); });
        b.classList.add('selected');
        console.log('[Scale] Selected:', val, '| stage:', currentStage, '| Q:', currentQuestion);
        submitResponse(String(val));
      };
    })(i, btn));
    optsDiv.appendChild(btn);
  }
  widget.appendChild(hintDiv);
  widget.appendChild(labelsDiv);
  widget.appendChild(optsDiv);
  bubble.appendChild(widget);
}
