// ── Replace placeholders and init conversation ────────────────────────────────
const activePrompt = (CONDITION === 'emotion' ? SYSTEM_PROMPT_EMOTION : SYSTEM_PROMPT_CONTROL)
  .replace(/PARTICIPANT_ID/g, participantId);

let s = [
  { role: 'system',    content: activePrompt },
  { role: 'assistant', content: OPENING_MESSAGE }   // pre-loaded, no API call needed
];

let currentStage = 1;
let currentQuestion = 0;
let scales = {
  distress_level_1: null, emotion_identify_reverse_1: null, emotion_identify_1: null,
  emotion_describe_hard_1: null, emotion_describe_easy_1: null,
  distress_level_2: null, emotion_identify_reverse_2: null, emotion_identify_2: null,
  emotion_describe_hard_2: null, emotion_describe_easy_2: null
};
let dataSaved = false;

// ── Save to Lark (via FC proxy — no credentials in this file) ────────────────
async function saveToLark() {
  if (dataSaved) return;
  dataSaved = true;
  try {
    const transcript = s.slice(1).map(m =>
      (m.role === 'user' ? '你' : '小暖') + ': ' + m.content
    ).join('\n\n');

    await fetch(PROXY_URL + '/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        participant_id: participantId,
        condition: CONDITION,
        ...scales,
        transcript
      })
    });
    console.log('[Save] Data sent to proxy.');
  } catch (err) { console.error('[Save] Error:', err); }
}

// ── Chat UI ───────────────────────────────────────────────────────────────────
function appendMsg(role, text) {
  const log = document.getElementById('chatLog');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? '你' : '小暖';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = text.replace(/\n/g, '<br>');
  row.appendChild(label);
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

// ── Scale tracking (condition-aware) ─────────────────────────────────────────
function parseAndSaveScale(msg) {
  const match = msg.match(/\d+/);
  const val = match ? parseInt(match[0]) : null;
  // Pre-scales: Stage 1, Q7-Q11 (same for both conditions)
  if (currentStage === 1) {
    if      (currentQuestion === 7)  scales.distress_level_1 = val;
    else if (currentQuestion === 8)  scales.emotion_identify_reverse_1 = val;
    else if (currentQuestion === 9)  scales.emotion_identify_1 = val;
    else if (currentQuestion === 10) scales.emotion_describe_hard_1 = val;
    else if (currentQuestion === 11) scales.emotion_describe_easy_1 = val;
  }
  // Post-scales: Stage 4 (emotion) or Stage 3 (control)
  const postStage = CONDITION === 'emotion' ? 4 : 3;
  if (currentStage === postStage) {
    if      (currentQuestion === 1) scales.distress_level_2 = val;
    else if (currentQuestion === 2) scales.emotion_identify_reverse_2 = val;
    else if (currentQuestion === 3) scales.emotion_identify_2 = val;
    else if (currentQuestion === 4) scales.emotion_describe_hard_2 = val;
    else if (currentQuestion === 5) scales.emotion_describe_easy_2 = val;
  }
}

// ── State machine (condition-aware) ──────────────────────────────────────────
function updateState(t) {
  // Stage 1: identical for both conditions
  if (currentStage === 1) {
    if      (t.includes("你能描述一下这件具体发生的事吗"))                          currentQuestion = 1;
    else if (t.includes("尝试和对方沟通过你的想法"))                               currentQuestion = 2;
    else if (t.includes("这种回应对你来说是有帮助的，还是让你感到更有压力"))        currentQuestion = 3;
    else if (t.includes("有没有跟工作以外的人"))                                   currentQuestion = 4;
    else if (t.includes("这种回应对你来说有帮助，还是让你感觉更有压力"))            currentQuestion = 5;
    else if (t.includes("有多困扰"))                                               currentQuestion = 7;
    else if (t.includes("很强烈的情绪"))                                           currentQuestion = 8;
    else if (t.includes("我清楚自己现在"))                                         currentQuestion = 9;
    else if (t.includes("难以用准确的语言来描述"))                                 currentQuestion = 10;
    else if (t.includes("能很容易地描述"))                                         currentQuestion = 11;
    else if (t.includes("谢谢你的回答"))   { currentStage = 2; currentQuestion = 0; }
    return;
  }

  if (CONDITION === 'emotion') {
    if (currentStage === 2) {
      if (t.includes("我们来聊聊"))       { currentStage = 3; currentQuestion = 0; }
    } else if (currentStage === 3) {
      if      (t.includes("我们再来评估一下"))                      { currentStage = 4; currentQuestion = 1; }
      else if (t.includes("脑海中会浮现什么具体想法"))               currentQuestion = 1;
      else if (t.includes("有没有一些你反复会对自己说的话"))         currentQuestion = 2;
      else if (t.includes("你最早是什么时候注意到"))                 currentQuestion = 3;
    } else if (currentStage === 4) {
      if      (t.includes("有多困扰"))                              currentQuestion = 1;
      else if (t.includes("有很强烈的情绪"))                         currentQuestion = 2;
      else if (t.includes("清楚自己现在对这件事"))                   currentQuestion = 3;
      else if (t.includes("难以用准确的语言"))                       currentQuestion = 4;
      else if (t.includes("能很容易地描述"))                         currentQuestion = 5;
      else if (t.includes("谢谢你的分享"))                          { currentStage = 5; }
    } else if (currentStage === 5) {
      if (t.includes("本次对话到此结束"))                            saveToLark();
    }
  } else { // control
    if (currentStage === 2) {
      if (t.includes("谢谢你愿意和我分享这些生活状态")) { currentStage = 3; currentQuestion = 1; }
    } else if (currentStage === 3) {
      if      (t.includes("有多困扰"))                              currentQuestion = 1;
      else if (t.includes("有很强烈的情绪"))                         currentQuestion = 2;
      else if (t.includes("清楚自己现在对这件事"))                   currentQuestion = 3;
      else if (t.includes("难以用准确的语言"))                       currentQuestion = 4;
      else if (t.includes("能很容易地描述"))                         currentQuestion = 5;
      else if (t.includes("谢谢你的分享"))                          { currentStage = 4; }
    } else if (currentStage === 4) {
      if (t.includes("本次对话到此结束"))                            saveToLark();
    }
  }
}

// ── API call ──────────────────────────────────────────────────────────────────
function sendToAI(messages) {
  const btn   = document.getElementById('chatSubmit');
  const input = document.getElementById('chatInput');
  btn.disabled = true; input.disabled = true;

  const log = document.getElementById('chatLog');
  const typingRow = document.createElement('div');
  typingRow.className = 'typing-row'; typingRow.id = 'typingIndicator';
  typingRow.innerHTML = '<div class="typing-label">小暖</div><div class="typing-bubble"><span></span><span></span><span></span></div>';
  log.appendChild(typingRow);
  log.scrollTop = log.scrollHeight;

  fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, messages, temperature: 0.7 })
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById('typingIndicator')?.remove();
    btn.disabled = false; input.disabled = false;
    if (data.choices?.[0]) {
      const reply = data.choices[0].message.content;
      s.push({ role: 'assistant', content: reply });
      appendMsg('ai', reply);
      updateState(reply);
    } else {
      appendMsg('ai', '抱歉，出现了一点问题，请重试。');
    }
  })
  .catch(err => {
    document.getElementById('typingIndicator')?.remove();
    btn.disabled = false; input.disabled = false;
    console.error('[Proxy]', err);
    appendMsg('ai', '网络连接出现问题，请检查您的网络后重试。');
  });
}

function handleSend() {
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = '42px';
  s.push({ role: 'user', content: text });
  appendMsg('user', text);
  parseAndSaveScale(text);
  sendToAI(s);
}

document.getElementById('chatSubmit').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = '42px';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Init: show opening message immediately, no API call ───────────────────────
appendMsg('ai', OPENING_MESSAGE);
