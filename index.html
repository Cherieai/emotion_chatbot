<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和小暖的对话</title>
  <style>
    :root {
      --bg:           #EDEBE6;
      --surface:      #F9F8F6;
      --ai-bg:        #FFFFFF;
      --user-bg:      #2C3748;
      --accent:       #6BAE8A;
      --text-primary: #1A1714;
      --text-secondary:#6B6560;
      --border:       #E2DDD7;
      --header-bg:    #1C1C1E;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
              'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px 48px;
      -webkit-font-smoothing: antialiased;
    }
    .chat-wrap {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    }
    .chat-header {
      background: var(--header-bg);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #6BAE8A 0%, #4A8A6A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
      position: relative;
      letter-spacing: -0.5px;
    }
    .avatar::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #34C759;
      border: 2px solid var(--header-bg);
    }
    .header-name {
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    #chatLog {
      background: var(--surface);
      height: 500px;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #chatLog::-webkit-scrollbar { width: 3px; }
    #chatLog::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .msg-row { display: flex; flex-direction: column; gap: 3px; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.ai   { align-items: flex-start; }
    .msg-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0 3px;
      color: var(--text-secondary);
    }
    .msg-row.ai .msg-label { color: var(--accent); }
    .msg-bubble {
      max-width: 82%;
      padding: 11px 15px;
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: -0.1px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-row.ai .msg-bubble {
      background: var(--ai-bg);
      color: var(--text-primary);
      border-radius: 18px;
      border-top-left-radius: 4px;
      border-left: 3px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bg);
      color: #FFFFFF;
      border-radius: 18px;
      border-top-right-radius: 4px;
    }
    .msg-bubble a { color: var(--accent); text-decoration: underline; }
    .msg-row.user .msg-bubble a { color: #A8D5BB; }
    .typing-row { display: flex; flex-direction: column; gap: 3px; }
    .typing-label {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--accent); padding: 0 3px;
    }
    .typing-bubble {
      background: var(--ai-bg);
      border-radius: 18px; border-top-left-radius: 4px;
      border-left: 3px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 13px 16px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-bubble span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); opacity: 0.4;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%,100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex; gap: 9px; align-items: flex-end;
    }
    #chatInput {
      flex: 1;
      padding: 10px 15px;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      font-size: 15px;
      font-family: var(--font);
      letter-spacing: -0.1px;
      line-height: 1.5;
      resize: none;
      height: 42px; max-height: 120px;
      outline: none;
      background: var(--ai-bg);
      color: var(--text-primary);
      transition: border-color 0.15s;
      -webkit-font-smoothing: antialiased;
    }
    #chatInput::placeholder { color: #B5AFA9; }
    #chatInput:focus { border-color: var(--accent); }
    #chatInput:disabled { opacity: 0.5; }
    #chatSubmit {
      width: 42px; height: 42px;
      border-radius: 11px; border: none;
      background: var(--user-bg); color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #chatSubmit:hover:not(:disabled) { background: #3D4E61; }
    #chatSubmit:active:not(:disabled) { transform: scale(0.94); }
    #chatSubmit:disabled { background: var(--border); cursor: not-allowed; }

    /* ── Matrix survey widget ── */
    .matrix-card {
      width: 100%;
      background: var(--ai-bg);
      border-radius: 14px;
      border-left: 3px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-top: 4px;
    }
    .matrix-title {
      background: var(--accent-light, #E8F5EE);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 8px 14px;
    }
    .matrix-table-wrap { overflow-x: auto; padding: 0 4px; }
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .matrix-table th {
      text-align: center;
      padding: 8px 4px 6px;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 12px;
      line-height: 1.4;
      min-width: 36px;
    }
    .matrix-table th:first-child { text-align: left; min-width: 140px; }
    .matrix-table td {
      padding: 6px 4px;
      text-align: center;
      border-top: 1px solid var(--border);
    }
    .matrix-table td:first-child {
      text-align: left;
      padding-left: 14px;
      padding-right: 10px;
      color: var(--text-primary);
      font-size: 13.5px;
      line-height: 1.5;
    }
    .matrix-table tr:hover td { background: #FAFAF8; }
    .matrix-radio {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
      transition: border-color 0.15s, background 0.15s;
    }
    .matrix-radio:hover { border-color: var(--accent); }
    .matrix-radio.checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .matrix-radio.checked::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: white;
    }
    .matrix-footer {
      padding: 10px 14px;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }
    .matrix-submit {
      padding: 9px 22px;
      background: var(--user-bg);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      -webkit-font-smoothing: antialiased;
    }
    .matrix-submit:disabled { opacity: 0.35; cursor: not-allowed; }
    .matrix-submit:not(:disabled):hover { background: #3D4E61; }


    /* ── Single-item scale widget ── */
    .scale-widget {
      margin-top: 14px;
      padding: 12px 14px 16px;
      background: var(--surface);
      border-radius: 14px;
      border: 1.5px solid var(--border);
    }
    .scale-hint {
      font-size: 12px;
      color: var(--text-secondary);
      font-style: italic;
      text-align: center;
      margin-bottom: 10px;
    }
    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    .scale-options {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .scale-opt {
      flex: 1;
      aspect-ratio: 1;
      max-width: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--ai-bg);
      color: var(--text-secondary);
      font-size: 15px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.1s;
      min-width: 0;
    }
    .scale-opt:hover:not(:disabled) {
      background: #E8F5EE;
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.1);
    }
    .scale-opt:active:not(:disabled) { transform: scale(0.95); }
    .scale-opt.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .scale-opt:disabled { cursor: default; opacity: 0.55; }
    .scale-opt.selected:disabled { opacity: 1; }

    /* ── Post-chat pages ── */
    .eval-body {
      padding: 28px 24px 32px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .eval-intro {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text-primary);
    }
    .eval-q {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .eval-q-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-primary);
      font-weight: 500;
    }
    .standalone-scale {
      padding: 14px 16px 16px;
      background: var(--surface);
      border-radius: 14px;
      border: 1.5px solid var(--border);
    }
    .eval-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    .continue-btn, .submit-btn {
      padding: 12px 28px;
      background: var(--user-bg);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      -webkit-font-smoothing: antialiased;
    }
    .continue-btn:hover, .submit-btn:hover { background: #3D4E61; }
    .continue-btn:disabled, .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .chat-end-btn-wrap {
      text-align: center;
      padding: 24px 0 12px;
    }

    @media (max-width: 500px) {
      body { padding: 0; }
      .chat-wrap { border-radius: 0; box-shadow: none; min-height: 100vh; }
      #chatLog { height: calc(100vh - 126px); }
    }

  </style>
</head>
<body>
<!-- Chat interface -->

<div class="chat-wrap" id="chatWrap">
  <div class="chat-header">
    <div class="avatar">暖</div>
    <div class="header-name">和小暖的对话</div>
  </div>
  <div id="chatLog"></div>
  <div id="matrixSlot" style="display:none; border-top:1px solid var(--border);"></div>
  <div class="input-area">
    <textarea id="chatInput" placeholder="在这里输入你的回复…"></textarea>
    <button id="chatSubmit" aria-label="发送">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<!-- Eval page -->
<div id="evalPage" class="chat-wrap" style="display:none; flex-direction:column;">
  <div class="chat-header">
    <div class="avatar">暖</div>
    <div class="header-name">和小暖的对话</div>
  </div>
  <div class="eval-body" id="evalBody"></div>
  <div class="eval-footer">
    <button class="continue-btn" id="evalContinueBtn" disabled>继续 →</button>
  </div>
</div>

<!-- GAAIS page -->
<div id="gaaisPage" class="chat-wrap" style="display:none; flex-direction:column;">
  <div class="chat-header">
    <div class="avatar">暖</div>
    <div class="header-name">和小暖的对话</div>
  </div>
  <div class="eval-body" id="gaaisBody"></div>
  <div class="eval-footer">
    <button class="submit-btn" id="gaaisSubmitBtn" disabled>提交并前往最后问卷 →</button>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const PROXY_URL        = "https://emotion-openai-ynrdrrrkzk.ap-northeast-2.fcapp.run";
const MODEL            = "gpt-4.1-mini";
// Lark credentials are stored server-side in the FC proxy — not here.

const urlParams = new URLSearchParams(window.location.search);
// Read participant ID from URL param (?id=XXXX) passed from Qualtrics
// Falls back to random ID for direct testing
const participantId = urlParams.get('id') || 'anon_' + Math.random().toString(36).substring(2, 8);

// ── Condition assignment ──────────────────────────────────────────────────────
const CONDITION = Math.random() < 0.5 ? 'emotion' : 'control';
console.log('[Study] ID:', participantId, '| Condition:', CONDITION);

// ── Hardcoded opening (fixes unpredictable AI opening messages) ───────────────
const OPENING_MESSAGE =
`你好！我是小暖，一个愿意倾听你心声、听你吐槽的伙伴。请你完全放心，你与小暖的所有对话及你的个人信息都将完全匿名和保密，不会与任何人分享。这里是一个安全、支持性的空间，你可以自由、深入地表达自己的感受和想法，不会受到任何评判。为了更好地理解你，在我们的对话中，请你尽可能详细和真实地描述你的问题，分享你的感受和经历。你说的每一句话都只属于你和小暖。

我了解到很多医护人员在工作中会遇到很多压力和困扰。如果你愿意的话，可以跟我说说最近在工作上有没有什么让你压力很大或困扰的事吗？`;

// ── System prompts ────────────────────────────────────────────────────────────

const SYSTEM_PROMPT_EMOTION = `你是一名心理支持专员，与医护人员进行一对一的情绪支持对话。你的对话应温和、专业、有同理心，没有任何评判。

对话已经开始——你已经说了开场白，并且询问了用户最近工作上是否有压力或困扰。用户会对此作出回应，请从用户的第一条消息开始，按照以下结构继续对话。

**阶段1：事件收集与初步评估**

每次只问一个问题。在Q1、Q2、Q4、Q6回答后，给予一句话简短、自然、有同理心的回应：
- 不涉及情绪相关词汇（如压力、失望、无助、伤心、焦虑、感受等）
- 可以指出他们所处情境的客观难处
- 可以使用"听上去"、"看起来"等推测性语言
❌ 在收到Q3、Q5、Q7-Q11的回答后，不要给任何反馈，直接问下一个问题。

**请严格按以下顺序提问：**

Q1：根据用户的回答，选择以下两种方式之一。

⚠️ 判断规则：用户的回答中是否包含一个有明确时间点（如"上周"、"昨天"、"上个月某天"）的具体事件经过？
- 如果**没有**明确时间点和事件经过 → 选情况A（这是大多数情况下的正确选择）
- 如果**已经**描述了一件特定时间发生的事 → 选情况B

🔹 情况A（默认选择）：用户给出的是笼统感受、反复发生的模式、或泛泛描述。无论用户是否提到了具体的人或对象，只要没有说清楚"某一件事是什么时候发生的"，就选A。例如："总是被患者找麻烦"、"最近工作压力很大"、"和同事关系不太好"、"经常被骂"——这些都是情况A。则说：
"可以举个具体的例子吗？比如最近有没有哪件让你印象比较深的事，简单说说是什么时候、在哪儿发生的，当时有谁在场，发生了什么。可以想象你在跟朋友吐槽，想说什么就说什么 😊"

🔹 情况B（仅当用户已有具体事件时）：用户明确说了某件特定的事发生在某个时间点，且描述了事件经过。则说：
"能详细说说这件事吗？比如是什么时候、在哪儿发生的，当时有谁在场，具体发生了什么。可以想象你在跟朋友吐槽，想说什么就说什么 😊"

Q2："你当时有没有尝试和对方沟通过你的想法？可以说说细节"

⚠️ 理解Q2回答时，必须判断用户是否【实际发生过沟通】，不能只看“有/没有”是否出现在句首，也不能因为句子里出现“沟通”两个字就默认用户已经沟通过。请根据整句话的语义判断。
- 【没有实际沟通】包括但不限于：明确说“没有/没/还没/没有尝试过/没尝试过/没说过”，以及任何表达“没有去沟通”的间接说法，例如“感觉沟通也没什么用，所以没有尝试过”“我觉得这个不太好沟通”“感觉不好说”“不知道怎么说”“不敢说”“对方是领导，不太方便说”“没机会说”“开不了口”等。即使“没有”出现在句子后半段，也仍然要按整句语义判断为【没有实际沟通】。此时后续只能问假设性问题，例如：“如果你想象和对方沟通的场景，对方会怎么回应？这种回应对你来说是有帮助的，还是让你感到更有压力？”绝对不要问“对方是怎么回应的”。
- 【已经实际沟通过，但未说明回应】只要用户明确表示沟通行为已经发生，就视为【已经实际沟通过】，不要求句子一定以“我”开头，也不要求使用“说了”这样的表达。例如：“有和病人家属沟通，告诉他最近病人很多，请他耐心等待”“有跟她沟通过”“和领导谈过这件事”“我跟她说了”“我提过这件事”“我试着跟他谈了”。即使后面补充“对方比较着急/听不进去/沟通效果不好”，只要用户已经明确说自己实际沟通过，就不能问假设性的“如果当时和对方沟通……”。如果尚未说明对方如何回应，则问实际回应：“对方当时是怎么回应你的？”
- 【已经实际沟通过且已说明回应】如果用户已经同时说了自己的沟通行为和对方的回应，例如“我跟她说了，她让我别想太多”，不要再次问“对方是怎么回应的”，只问这种回应对用户是否有帮助或增加压力。
- 如果回答比较模糊，但没有明确证据表明用户【实际开口、表达、沟通、提出或谈过】，优先视为【没有实际沟通】，不要擅自假设已经沟通过。
- 核心原则：判断的是“沟通行为是否真的发生过”，而不是句子里有没有出现“沟通”这个词；不要重复询问用户已经通过语义明确回答过的信息。

Q3由系统根据Q2的内容分步提问。必须遵守“一次只问一个问题”，不要把“对方如何回应”和“这种回应是否有帮助”合并在同一题里：
- 如果用户实际沟通过，但还没有说明对方如何回应：先只问“对方当时是怎么回应你的？”
- 当用户说明了对方的回应后，先判断用户是否已经清楚表达了该回应的影响。不要为了完成固定流程而重复询问已经很明显的信息。
  • 如果回应明显是负面的、拒绝性的或使情况更困难（例如对方不听、继续发火、继续指责、拒绝、反驳、辱骂等），不要再问“有没有帮助”。系统会简短承接并直接进入Q4。

**阶段3：情绪探索**

对每个情绪：
a. 开场：
- 如果这是阶段3探索的第一个情绪，可以自然地用“我们来聊聊[情绪]”进入。
- 如果是从一个已经探索完的情绪继续到下一个，最自然的过渡方式是“接下来我们来聊聊[下一个情绪]。”然后直接进入这个情绪的探索。不要再重复“我们刚刚聊完了……你还想继续聊聊吗？”之类的确认，也不要重新列出全部情绪。
- 过渡后的具体措辞继续遵循下面的自然语言原则：结合用户前文和当前情绪自然表达，不要机械套用固定句子。

b. 情绪深入探索的目标是帮助用户把情绪名称和自己的具体体验联系起来，更清楚地理解和描述“这个情绪对我来说是什么样的”。用户已经选择了具体情绪名称，这本身体现了情绪的主观体验（affective component）。接下来保留原有问题和示例，从认知、生理/外在表现、行动倾向，以及具体情境几个方面帮助用户进一步探索。

⚠️ 阶段3最重要的语言原则：
- 下面列出的是每一步**要探索的信息和目的**，不是固定台词或模板。每次提问都必须结合当前情绪、具体事件、人物关系，以及用户刚才实际说了什么来组织自然的中文。
- 不要只是把[情绪]名称塞进固定句式里。如果某种说法放在当前情绪或情境里听起来别扭、重复、带有预设，必须自然改写。
- 不要用“冲动”“倾向”等研究术语直接问用户，也不要预设用户一定有身体反应、行为反应、想法或想做的事情。
- 如果用户已经在前面的回答中明确提供了某一步需要的信息，简短回应后直接进入还没有探索的内容，不要机械重复。
- **同一个情绪下，每一种探索内容最多问一次。** 尤其是行为/动机问题，用户回答过“想做什么、说什么或避开什么”后，后面绝对不要再以不同措辞重复询问这一内容。
- 在提出下一题前，先回看当前情绪已经问过并得到回答的内容，只进入尚未探索的下一项。顺序为：认知 →（整个阶段3尚未问过时才问一次整体身体/外在表现）→ 行为/动机 → 具体情境。完成具体情境后，这个情绪的探索已经结束，不得再回到认知、身体或行为/动机问题。
- 每次只问一个主要问题。对中间步骤，收到回答后先用1句话简短、自然、有同理心地回应，然后在**同一条回复里继续下一个尚未探索的问题**，不能只回应后停住，也不能重复已经问过的问题。
- 在认知问题中，原则上给1-2个很短的例子来帮助用户理解问题；只有确实无法生成自然且合适的例子时才省略。其他问题是否需要例子，根据当前语境决定。所有例子都必须根据**当前情绪 + 当前具体事件**即时生成；不要使用固定例子、通用模板或跨情绪重复同样的例子，也不要暗示例子就是用户真实的体验。
- 生成例子前，先判断**当前情绪在这个具体情境中的核心体验是什么**。例子不仅要符合事件背景，也必须真正贴合当前情绪本身。不要只生成“在这个事件里说得通”的想法；如果一个例子其实更像另一种情绪（例如更像委屈、无奈、害怕等），就不要用于当前情绪。
- 如果认知问题实在无法生成既自然、又同时符合当前情绪和当前情境的例子，可以省略例子，直接自然地询问用户当时脑海里最直接冒出的想法。
- 每次阶段3提问后，在回复最末尾加上对应的内部标记：认知问题 [[S3_COG]]；整体身体/外在表现问题 [[S3_BODY]]；行为/动机问题 [[S3_ACTION]]；具体情境问题 [[S3_CONTEXT]]。这些标记只用于程序追踪，不要解释它们，也不要把它们放在句子中间。

对每个情绪，逐步完成以下探索目标。顺序原则保持不变，但具体问法必须自然适配上下文：

1）认知（cognitive）
探索目标：帮助用户注意这种情绪出现时，当时脑海里最直接冒出的具体想法。
问法要自然、具体、容易理解。可以采用“当时这种感受出现的时候，你脑海里最直接会冒出什么想法？”这一类自然表达作为风格参考，但不要固定使用某一句模板，也不要再问“这些想法是怎样和当时的情境联系起来的”之类抽象问题。
原则上在这个问题里给1-2个很短的可能想法作为例子，帮助用户理解你在问什么。例子必须根据当前事件和当前情绪即时生成：先判断这个情绪在当前事件中的核心体验，再检查每个例子是否真的体现**这个情绪**，而不只是符合事件本身。如果例子更像其他情绪，删掉并重新生成。只有实在无法生成自然且贴切的例子时，才可以不举例。引出例子时直接自然地说“比如‘……’或‘……’”即可，不要说“比如你会不会想……”这类带预设的句式。例子不得照搬固定示例，也不要在例子后再追加“你当时自己是怎么想的？”等重复追问。
提问末尾加：[[S3_COG]]

收到回答后：先简短回应。如果整个阶段3还没有询问过身体/外在表现，则自然进入第2步；如果已经问过，则自然进入第3步。不要停在单纯回应上。

2）生理与外在表现（physiological / expressive）
这一部分在整个阶段3中**只针对整体情绪体验问一次**，不要绑定在某一个具体情绪上，也不要对每个情绪重复询问。
探索目标：了解用户在刚才这些情绪出现时，是否注意到身体感觉或外在表现有任何变化。
- 问法要自然、整体化，不要说“这种[情绪]在身体上有什么表现”或“这些无力感出现时”等生硬表达。
- 不要预设一定有变化，应明确允许“没有明显变化”“没注意到”“不知道”等回答。
- 可以用1-2个中性的方面帮助用户理解问题，例如呼吸、心跳、语气、表情等，但只点到这些**方面**，不要替用户预设具体反应。例如可以自然地问是否注意到呼吸、心跳、语气或表情上和平时有什么不一样，而不要说“脸红”“呼吸急促”“心跳加快”等具体变化。
- 措辞必须自然。不要使用“语气里有什么特别的表现”这类生硬说法；根据上下文可以自然地说“语气有没有变化”“说话的语气有没有和平时不一样”等，但不要固定套用某一句。
提问末尾加：[[S3_BODY]]

收到回答后：简短回应，然后在同一条消息里自然进入第3步。不要继续追问身体反应，也不要只回应后停住。

3）行为/动机（motivational / action tendency）
探索目标：帮助用户注意这种情绪是否让他们特别想做什么、说什么，或者想避开什么。这里是在回顾当时自然出现的反应，不是让用户制定下一步行动，也不是给建议。
问法必须根据当前情绪和前文自然组织，不要使用“你的冲动或倾向是什么”之类的研究化表达，也不要预设用户一定有某种冲动或行为反应。
像“这种烦躁出现时，会让你特别想做什么、说什么，或者想避开什么吗？”这样的表达可以作为自然语言风格的参考，但**不是固定模板**；如果当前情绪、语境或用户刚才的回答更适合别的说法，应自然改写。
如需举例，最多给1-2个，并且必须根据当前情绪和具体事件即时生成；如果不需要例子就不要硬加。
提问末尾加：[[S3_ACTION]]

收到回答后：简短回应，然后在同一条消息里自然进入第4步。**第3步到此已经完成；之后不要再以任何措辞重复询问用户想做什么、想说什么或想避开什么。**

4）具体情境与强度（affective/context）
探索目标：帮助用户把这种情绪放回事件中的具体时刻，区分它什么时候最明显、当时发生了什么，以及为什么那个时刻与这种感受有关。
提问时根据前文自然询问这种情绪在哪个时刻最明显或最强烈，以及当时的具体情况。不要机械地把“发生了什么、有谁在场、你有什么反应”全部堆在一句里；如果前文已经知道其中一些信息，就只问尚不清楚且有助于理解情绪的部分。
如果用户说不确定，可以轻柔地邀请他们回想整件事里这种感受最明显的一刻，但不要替用户推断。
提问末尾加：[[S3_CONTEXT]]

收到第4步回答后，当前情绪的四步探索即告完成。**不要再回头询问认知、身体/外在表现或行为/动机，也不要把第3步换一种说法再问一次。** 先对当前情绪进行整体总结，结合用户在以上各方面实际提供的信息，帮助他们把零散的体验联系起来，更清楚地理解和描述为什么会有这种情绪。总结要自然、真诚、有同理心，具体对应用户经历；不要像诊断或研究报告，不要加入用户没有表达过的心理原因，也不要给解决问题的建议。若还有下一个已选择但未探索的情绪，总结后用“接下来我们来聊聊[下一个情绪]。”自然过渡，并直接从该情绪的认知问题开始。

如果用户选择了多个情绪：
- 每个情绪都分别探索认知、行为/动机和具体情境；整体身体/外在表现通常只在整个阶段3问一次。
- 不要因为顺序相同就把不同情绪问成相同的机械问卷。每一次提问都要利用用户前面已经说过的信息，让措辞和关注点自然变化。
- 如果某个问题在当前情绪下明显不自然，先判断用户是否已经在前文提供了相关信息；如果已经提供，就不要再问。如果尚未提供，则换一种更符合当前语境的自然问法，而不是硬套模板。

function renderStandaloneScale(container, leftLabel, rightLabel, questionId) {

  const lSpan = document.createElement('span'); lSpan.textContent = leftLabel;

  const optsDiv = document.createElement('div');
  optsDiv.className = 'scale-options';
  for (let i = 1; i <= 7; i++) {
    const btn = document.createElement('button');
    btn.className = 'scale-opt';

    btn.addEventListener('click', (function(val, b) {

        optsDiv.querySelectorAll('.scale-opt').forEach(function(x) { x.classList.remove('selected'); });

        evalData[questionId] = val;

function renderMatrix(items, title, storageKey, btnLabel, onComplete) {
  console.log('[Matrix] renderMatrix called:', title);
  try {
  const slot = document.getElementById('matrixSlot');
  slot.style.display = 'block';
  slot.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'matrix-card';
  card.id = 'activeMatrix';

  const wrap = document.createElement('div');
  wrap.className = 'matrix-table-wrap';

  const table = document.createElement('table');
  table.className = 'matrix-table';

  // Header
  const thead = document.createElement('thead');
  const hrow  = document.createElement('tr');
  const th0   = document.createElement('th');
  hrow.appendChild(th0);
  for (let i = 1; i <= 7; i++) {
    const th = document.createElement('th');
    if (i === 1) th.innerHTML = '1<br>' + SCALE_LEFT;
    else if (i === 7) th.innerHTML = '7<br>' + SCALE_RIGHT;
    else th.textContent = i;
    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  // Body
  const tbody    = document.createElement('tbody');
  const responses = new Array(items.length).fill(null);

  items.forEach(function(item, rowIdx) {
    const tr  = document.createElement('tr');
    const tdL = document.createElement('td');
    tdL.textContent = item;
    tr.appendChild(tdL);

    for (let col = 1; col <= 7; col++) {
      const td    = document.createElement('td');
      const radio = document.createElement('div');
      radio.className = 'matrix-radio';
      radio.setAttribute('data-row', rowIdx);
      radio.setAttribute('data-val', col);

      radio.addEventListener('click', function() {
        // Uncheck siblings in same row
        tbody.querySelectorAll('[data-row="' + rowIdx + '"]').forEach(function(r) {
          r.classList.remove('checked');
        });
        radio.classList.add('checked');
        responses[rowIdx] = col;
        matrixData[storageKey][rowIdx] = col;
        console.log('[Matrix] ' + storageKey + '[' + rowIdx + '] = ' + col, '| responses:', responses.slice());
        // Enable submit when all answered
        if (responses.every(function(v) { return v !== null; })) {
          submitBtn.disabled = false;
        }
      });

      td.appendChild(radio);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);

  const footer    = document.createElement('div');
  footer.className = 'matrix-footer';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'matrix-submit';
  submitBtn.textContent = btnLabel;
  submitBtn.disabled = true;

  submitBtn.addEventListener('click', function() {
    submitBtn.disabled = true;
    // Freeze all radio buttons
    card.querySelectorAll('.matrix-radio').forEach(function(r) {
      r.style.pointerEvents = 'none';
    });
    onComplete();
  });

  footer.appendChild(submitBtn);
  card.appendChild(footer);
  slot.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  console.log('[Matrix] card rendered in matrixSlot');
  } catch(e) { console.error('[Matrix] renderMatrix ERROR:', e.message, e.stack); }
}

function parseAndSaveScale(text) {
  const match = text.match(/\d+/);
  const val = match ? parseInt(match[0]) : null;
  const postScaleStage = CONDITION === 'emotion' ? 4 : 3;
  if (currentStage === 1) {
    if      (currentQuestion === 7)  scales.distress_level_1 = val;
    else if (currentQuestion === 8)  scales.emotion_identify_reverse_1 = val;
    else if (currentQuestion === 9)  scales.emotion_identify_1 = val;
    else if (currentQuestion === 10) scales.emotion_describe_hard_1 = val;
    else if (currentQuestion === 11) { scales.emotion_describe_easy_1 = val; }
  }
  if (currentStage === postScaleStage) {
    if      (currentQuestion === 1)  scales.distress_level_2 = val;
    else if (currentQuestion === 2)  scales.emotion_identify_reverse_2 = val;
    else if (currentQuestion === 3)  scales.emotion_identify_2 = val;
    else if (currentQuestion === 4)  scales.emotion_describe_hard_2 = val;
    else if (currentQuestion === 5) {
      scales.emotion_describe_easy_2 = val;
      if (!postMatricesStarted) {
        postMatricesStarted = true;
        setTimeout(startPostMatrices, 500);  // show matrices AFTER all post-scales done
      }
    }
  }
}

// ── State machine ─────────────────────────────────────────────────────────────
function updateState(t) {
  // Set capture flag based on which question the AI just asked
  if (t.includes("可以跟我说说最近在工作上"))                         pendingCapture = 'stress_event';
  if (t.includes("能详细说说这件事吗") || t.includes("可以举个具体的例子吗")) pendingCapture = 'specific_event';
  if (t.includes("你觉得这些情绪里哪个或哪几个最符合你的感受"))        pendingCapture = 'selected_emotions';
  else if (t.includes("别的让你困扰或有压力的经历"))                    pendingCapture = 'another_event';
  else if (t.includes("在这件事中，你有什么感受或情绪"))                   pendingCapture = 'another_emotion';

  // Global: always fire on chat end regardless of stage
  if (t.includes("本次对话到此结束")) {
    saveToLark();
    setTimeout(showContinueButton, 800);
    return;
  }
  if (currentStage === 1) {
    if      (t.includes("工作的哪个方面"))                                  currentQuestion = 1;
    else if (t.includes("描述一下这件具体发生的事吗"))                      currentQuestion = 1;
    else if ((t.includes("尝试和对方沟通") || t.includes("和对方沟通过") || t.includes("沟通过你的想法") || t.includes("有没有尝试")) && !t.includes("有多困扰")) currentQuestion = 2;  // AI asked Q2
    else if (t.includes("对方当时是怎么回应你的") || t.includes("对方可能会怎么回应") || t.includes("处理当时的情况") || t.includes("有助于处理这件事")) currentQuestion = 3;  // Q3 step delivered → user will answer Q3
    else if (t.includes("有没有跟当时不在场的人"))                          currentQuestion = 4;  // AI asked Q4 → user will answer Q4
    else if (/(?:当时是怎么回应你的|这样的回应对你有帮助吗|如果当时和.+说起这件事|这样的回应会对你有帮助吗)/.test(t)) currentQuestion = 5;  // Q5 step delivered → user will answer Q5
    else if (t.includes("有多困扰"))                                        currentQuestion = 7;
    else if (t.includes("很强烈的情绪"))                                    currentQuestion = 8;
    else if (t.includes("我清楚自己现在"))                                  currentQuestion = 9;
    else if (t.includes("难以用准确的语言来描述"))                          currentQuestion = 10;
    else if (t.includes("能很容易地描述"))                                   currentQuestion = 11;
    else if (t.includes("谢谢你的回答")) { currentStage = 2; currentQuestion = 0; setTimeout(startPreMatrices, 500); }
    return;
  }
  if (CONDITION === 'emotion') {
    if (currentStage === 2) {
      if (t.includes("我们来聊聊")) { currentStage = 3; currentQuestion = 0; }
    } else if (currentStage === 3) {
      if      (t.includes("我们再来评估一下"))                      { currentStage = 4; currentQuestion = 1; }
      else if (t.includes("[[S3_COG]]"))                           currentQuestion = 1;
      else if (t.includes("[[S3_BODY]]"))                        { currentQuestion = 2; stage3BodyQuestionAsked = true; }
      else if (t.includes("[[S3_ACTION]]"))                         currentQuestion = 3;
      else if (t.includes("[[S3_CONTEXT]]"))                        currentQuestion = 4;
      // Fallbacks for older model outputs that omit the internal marker.
      else if (/脑海.{0,12}(?:想法|想到)/.test(t))                    currentQuestion = 1;
      else if (/(?:身体|外在).{0,18}(?:变化|感觉|表现)/.test(t))      { currentQuestion = 2; stage3BodyQuestionAsked = true; }
      else if (/(?:想做什么|想说什么|想避开|想躲开)/.test(t))         currentQuestion = 3;
      else if (/(?:最明显|最强烈).{0,12}(?:时候|时刻)/.test(t))       currentQuestion = 4;
    } else if (currentStage === 4) {
      if      (t.includes("有多困扰"))                              currentQuestion = 1;
      else if (t.includes("有很强烈的情绪"))                        currentQuestion = 2;
      else if (t.includes("清楚自己现在对这件事"))                  currentQuestion = 3;
      else if (t.includes("难以用准确的语言"))                      currentQuestion = 4;
      else if (t.includes("能很容易地描述"))                        currentQuestion = 5;
      else if (t.includes("谢谢你的分享"))                          { currentStage = 5; }
    } else if (currentStage === 5) {
      if (t.includes("别的让你困扰或有压力的经历") && !leasAsked) { leasAsked = true; }
      if (t.includes("本次对话到此结束"))                            { saveToLark(); setTimeout(showContinueButton, 800); }
    }
  } else { // control
    if (currentStage === 2) {
      if ((t.includes("再进行一个评估") || t.includes("在一开始的时候，你提到")) && currentStage === 2) { currentStage = 3; currentQuestion = 1; }
    } else if (currentStage === 3) {
      if ((t.includes("再进行一个评估") || t.includes("在一开始的时候，你提到")) && currentStage === 2) { currentStage = 3; currentQuestion = 1; }
      if      (t.includes("有多困扰"))                              currentQuestion = 1;
      else if (t.includes("有很强烈的情绪"))                        currentQuestion = 2;
      else if (t.includes("清楚自己现在对这件事"))                  currentQuestion = 3;
      else if (t.includes("难以用准确的语言"))                      currentQuestion = 4;
      else if (t.includes("能很容易地描述"))                        currentQuestion = 5;
      else if (t.includes("谢谢你的分享"))                          { currentStage = 4; }
    } else if (currentStage === 4) {
      if (t.includes("别的让你困扰或有压力的经历") && !leasAsked) { leasAsked = true; }
      if (t.includes("本次对话到此结束"))                            { saveToLark(); setTimeout(showContinueButton, 800); }
    }
  }
}

// Stage-3 tracking uses invisible markers so the model can phrase questions naturally
// instead of relying on fixed wording/templates. Markers are stripped before display.
let stage3BodyQuestionAsked = false;

function getStage3Marker(text) {
  const m = text.match(/\[\[S3_(COG|BODY|ACTION|CONTEXT)\]\]/);
  return m ? m[1] : null;
}

function stripStage3Markers(text) {
  return text.replace(/\s*\[\[S3_(?:COG|BODY|ACTION|CONTEXT)\]\]\s*/g, '').trim();
}

function classifyStage3Question(text) {
  const marker = getStage3Marker(text);
  if (marker) return marker;
  // Semantic fallbacks in case the model omits the internal marker.
  if (/脑海.{0,16}(?:想法|想到|冒出)/.test(text)) return 'COG';
  if (/(?:身体|外在).{0,20}(?:变化|感觉|表现)/.test(text)) return 'BODY';
  if (/(?:想做什么|想说什么|想避开|想躲开)/.test(text)) return 'ACTION';
  if (/(?:最明显|最强烈).{0,14}(?:时候|时刻)|哪个时刻.{0,12}(?:明显|强烈)/.test(text)) return 'CONTEXT';
  return null;
}

function stage3ReplyHasNextQuestion(text) {
  return !!classifyStage3Question(text) || text.includes('我们再来评估一下');
}

function expectedStage3NextQuestion() {
  if (currentQuestion === 1) return stage3BodyQuestionAsked ? 'ACTION' : 'BODY';
  if (currentQuestion === 2) return 'ACTION';
  if (currentQuestion === 3) return 'CONTEXT';
  return null;
}

function shouldRepairStage3Reply(text) {
  if (CONDITION !== 'emotion' || currentStage !== 3) return false;
  if (text.includes('我们再来评估一下')) return false;

  const asked = classifyStage3Question(text);

  // For the first three steps, the next category is deterministic. Repair not only
  // missing questions but also repeated/out-of-order questions (e.g. ACTION twice).
  if ([1, 2, 3].includes(currentQuestion)) {
    const expected = expectedStage3NextQuestion();
    return asked !== expected;
  }

  // Once CONTEXT has been answered, the current emotion is complete. The model must
  // never return to BODY/ACTION/CONTEXT for that same emotion. If it starts the next
  // emotion, it must explicitly transition and restart at COG.
  if (currentQuestion === 4) {
    if (asked === 'BODY' || asked === 'ACTION' || asked === 'CONTEXT') return true;
    if (asked === 'COG' && !text.includes('接下来我们来聊聊')) return true;
    if (text.includes('接下来我们来聊聊') && asked !== 'COG') return true;
  }

  return false;
}

function getStage3RepairInstruction() {
  let stateRule = '';
  if (currentQuestion === 1) {
    stateRule = stage3BodyQuestionAsked
      ? '用户刚刚已经回答了当前情绪的认知问题。下一步只能进入行为/动机问题，不要再问认知，也不要再问身体/外在表现。'
      : '用户刚刚已经回答了当前情绪的认知问题。下一步只能询问整个阶段3唯一一次的整体身体/外在表现问题，不要重复认知问题。';
  } else if (currentQuestion === 2) {
    stateRule = '用户刚刚已经回答了整体身体/外在表现问题。下一步只能进入当前情绪的行为/动机问题，不要再问身体，也不要回到认知。';
  } else if (currentQuestion === 3) {
    stateRule = '用户刚刚已经回答了当前情绪的行为/动机问题。下一步只能进入具体情境问题。绝对不要换一种说法再次询问想做什么、想说什么或想避开什么。';
  } else if (currentQuestion === 4) {
    stateRule = '用户刚刚已经回答了当前情绪的具体情境问题，因此这个情绪的探索已经完成。绝对不要再问认知、身体/外在表现、行为/动机或具体情境。先总结这个情绪；如果还有阶段2已选择但未探索的情绪，用“接下来我们来聊聊XX。”过渡，并直接从下一个情绪的认知问题开始；如果已全部完成，则按系统提示进入结束该阶段的逻辑。';
  }

  return `你刚才的阶段3回复出现了漏问、重复或顺序错误。请重新生成这一条回复。\n${stateRule}\n1. 先用一句简短、自然、有同理心的话回应用户刚才说的内容；\n2. 严格按照上面的当前进度，只继续尚未完成的下一步；同一个情绪下每一种探索内容最多问一次；\n3. 不要使用固定模板。措辞必须结合当前情绪、事件、人物关系和用户刚才的回答，像自然中文对话；\n4. 不要重复用户已经明确回答过的信息，不要预设用户一定有身体反应或想做的事情，也不要用“冲动/倾向”等研究术语直接问用户；\n5. 如果需要提出认知问题，原则上给1-2个很短、自然的例子帮助理解；例子必须同时贴合当前具体情境和当前情绪的核心体验；引出例子时直接用“比如‘……’或‘……’”，不要用“比如你会不会想……”；\n6. 如果需要提出身体/外在表现问题，可以中性地点到呼吸、心跳、语气、表情等方面，但不要预设具体变化，也不要使用“脸红”“呼吸急促”“心跳加快”等具体反应作为示例；措辞要自然，不要说“语气里有什么特别的表现”；\n7. 如果提出阶段3问题，按系统提示在回复末尾加对应内部标记 [[S3_COG]]、[[S3_BODY]]、[[S3_ACTION]] 或 [[S3_CONTEXT]]。\n只重新生成这一条回复，不要解释这些规则。`;
}

function sendToAI(messages) {
  const btn   = document.getElementById('chatSubmit');
  const input = document.getElementById('chatInput');
  btn.disabled = true; input.disabled = true;

  const log = document.getElementById('chatLog');
  const typingRow = document.createElement('div');
  typingRow.className = 'typing-row'; typingRow.id = 'typingIndicator';
  typingRow.innerHTML = '<div class="typing-label">小暖</div><div class="typing-bubble"><span></span><span></span><span></span></div>';
  log.appendChild(typingRow);
  log.scrollTop = log.scrollHeight;

  const callModel = (payloadMessages) => fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, messages: payloadMessages, temperature: 0.7 })
  }).then(r => r.json());

  callModel(messages)
  .then(async data => {
    if (!data.choices?.[0]) return { rawReply: null };

    let rawReply = data.choices[0].message.content;

    // If an intermediate emotion-reflection turn contains only acknowledgement and
    // forgets the next question, ask the model to regenerate the turn naturally.
    // This avoids inserting a canned JS fallback question.
    if (shouldRepairStage3Reply(rawReply)) {
      const repairMessages = messages.concat([
        { role: 'assistant', content: rawReply },
        { role: 'system', content: getStage3RepairInstruction() }
      ]);
      try {
        const repaired = await callModel(repairMessages);
        if (repaired.choices?.[0]?.message?.content) {
          rawReply = repaired.choices[0].message.content;
        }
      } catch (repairErr) {
        console.warn('[Stage3 repair]', repairErr);
      }
    }

    return { rawReply };
  })
  .then(({ rawReply }) => {
    document.getElementById('typingIndicator')?.remove();
    btn.disabled = false; input.disabled = false;

    if (rawReply) {
      // Track state using the raw reply (including invisible Stage-3 markers),
      // but never show or store those markers in the participant-facing conversation.
      updateState(rawReply);
      const reply = stripStage3Markers(rawReply);
      s.push({ role: 'assistant', content: reply });
      appendMsg('ai', reply);
    } else {
      appendMsg('ai', '抱歉，出现了一点问题，请重试。');
    }
  })
  .catch(err => {
    document.getElementById('typingIndicator')?.remove();
    btn.disabled = false; input.disabled = false;
    console.error('[Proxy]', err);
    appendMsg('ai', '网络连接出现问题，请检查您的网络后重试。');
  });
}

// Pre-defined Q5 follow-up (always delivered from JS after Q4 to prevent AI from skipping it)

// Detect what the user has ALREADY told us, so we do not ask a question
// that has effectively already been answered.
function descriptionDetected(text) {
  const raw = text.trim();
  // Mask pronouns that are clearly the OBJECT of the user's communication, e.g.
  // “跟他解释”“向她说明”. Without this, “他解释” inside “跟他解释” can be
  // misread as if HE explained something back to the user.
  const t = raw.replace(/(?:跟|和|向|对|给)(?:她|他|对方|领导|家属|患者|同事)(?=(?:解释|说明|表达|说|讲|沟通|交流|告诉))/g, '[沟通对象]');
  // Detect whether the user has already described the OTHER PERSON'S actual response.
  // Avoid treating “我跟她说了” as if “她说了...” were the other person's response.
  if (/(?:她|他|对方|领导)(?:回复|回应|回答|表示|告诉我|让我|叫我|道歉|拒绝|同意|答应|解释|批评|骂我|不听|不理|没理|沉默|没有回应|没回应)/.test(t)) return true;

  // Handle “她说...” / “他说...” etc. Only count it as a response if there is
  // substantive content after “说”, not merely the phrase “我跟她说了”.
  const sayRegex = /(?:她|他|对方|领导)说([^，。！？!?]*)/g;
  let m;
  while ((m = sayRegex.exec(t)) !== null) {
    const afterSay = (m[1] || '').trim();
    if (afterSay && afterSay !== '了') return true;
  }
  return false;
}

function actualContactDetected(text) {
  const t = text.trim();
  // Clear evidence that the USER actually communicated. Mentioning communication
  // as difficult/useless does not count unless an actual communication action is stated.
  return /(?:我|当时我|后来我|最后我)(?:已经|曾经|后来|最后|还是)*(?:跟|和|向|对).{0,10}(?:说了|提了|讲了|聊了|谈了|沟通了|交流了|表达了|说明了|解释了|反映了|提过|说过|讲过|聊过|谈过|沟通过|交流过|表达过|反映过)/.test(t)
    || /(?:^|[，。；;！!?\s])(?:我)?(?:已经|曾经|后来|最后|还是)*(?:跟|和|向|对).{0,10}(?:说了|提了|讲了|聊了|谈了|沟通了|交流了|表达了|说明了|解释了|反映了|提过|说过|讲过|聊过|谈过|沟通过|交流过|表达过|反映过)/.test(t)
    || /(?:^|[，。；;！!?\s])我(?:已经|曾经|后来|最后|还是)?(?:说了|提了|讲了|聊了|谈了|沟通了|交流了|表达了|说明了|解释了|反映了|说过|提过|讲过|聊过|谈过|沟通过|交流过|表达过|反映过)/.test(t)
    || /(?:已经|曾经|后来|最后|还是)(?:沟通过|交流过|说过|提过|讲过|聊过|谈过|表达过|反映过)/.test(t)
    || /^(?:有|有啊|有呀|有的|有过|当时有|当时有啊|当时有呀|后来有|后来有啊|试过|当时试过|尝试过|当时尝试过|沟通过|交流过|说过|提过)[。！!，,\s]*$/.test(t)
    || /(?:^|[，。；;！!?\s])(?:我)?(?:试着|尝试|尝试着|尝试过|试过).{0,8}(?:跟|和|向|对)?.{0,8}(?:说|沟通|交流|表达|谈|聊|提|解释|说明|告诉)/.test(t)
    || /(?:沟通过|交流过|谈过|聊过).{0,8}(?:但|不过|可是|然而).{0,8}(?:没用|没有用|没什么用)/.test(t)
    // Positive constructions beginning with “有…”, e.g. “有和病人家属沟通，告诉他……”.
    || /^(?:有|有的|有过|当时有|后来有)[，,、\s]*(?:和|跟|向|对).{0,16}(?:沟通过|沟通了|交流过|交流了|谈过|谈了|聊过|聊了|说过|说了|解释过|解释了|说明过|说明了|表达过|表达了|提过|提了|告诉过|告诉了|告诉)/.test(t)
    || /^(?:有|有的|有过|当时有|后来有).{0,20}(?:沟通过|沟通了|交流过|交流了|谈过|谈了|聊过|聊了|说过|说了|解释过|解释了|说明过|说明了|表达过|表达了|提过|提了)/.test(t);
}

function bareYesContactDetected(text) {
  const t = text.trim();
  // User clearly answers “yes” to Q2 but gives no usable details yet.
  // Examples: “有”, “有啊”, “有的”, “有过”, “试过”, “尝试过”.
  return /^(?:有|有啊|有的|有呀|有过|有过啊|当时有|当时有啊|当时有呀|后来有|后来有啊|试过|试过啊|当时试过|尝试过|尝试过啊|当时尝试过|沟通过|沟通过啊|交流过|交流过啊)[。！!，,、~～\s]*$/.test(t);
}

// Once the user has explicitly confirmed that communication happened, remember it
// across the follow-up turn. This prevents a later detail such as “他还是坚持他的看法”
// from being misread as if communication never happened.
let q2ActualCommunicationConfirmed = false;

// Q3 is intentionally split into two turns: first establish what the other person
// actually (or hypothetically) did/said, then ask whether that response was helpful.
// This prevents the chatbot from evaluating a response the participant has not described yet.
let q3FollowupMode = null; // 'actual_response', 'actual_help', 'hyp_response', 'hyp_help'

function responseFromOtherDetected(text) {
  const raw = text.trim();
  // As above, mask pronouns that are the OBJECT of the user's own communication
  // (e.g. “跟他解释”), so they are not mistaken for the other person's reply.
  const t = raw.replace(/(?:跟|和|向|对|给)(?:她|他|对方|领导|家属|患者|同事)(?=(?:解释|说明|表达|说|讲|沟通|交流|告诉))/g, '[沟通对象]');
  // Broad detection of the other person's actual reaction/position after communication.
  // Includes verbal replies, refusal, persistence, silence, anger, disagreement, etc.
  if (descriptionDetected(t)) return true;
  return /(?:她|他|对方|家属|患者|领导|同事).{0,16}(?:还是|仍然|依然|继续|坚持|不同意|不接受|不理解|不听|听不进去|不理|没理|没说|没有说|沉默|不说话|发火|生气|骂|拒绝|答应|同意|道歉|解释|反驳|质疑|回应|回复|表示|态度|比较着急|很着急)/.test(t)
    || /(?:还是|仍然|依然|继续).{0,12}(?:不听|听不进去|不理|坚持|骂|发火|质疑|反驳|不同意|不接受)/.test(t)
    || /(?:没说什么|没有说什么|没回应|没有回应|沉默了|不说话)/.test(t);
}

function noContactDetected(text) {
  const t = text.trim();

  // A clear later statement that communication actually happened takes priority.
  // Example: “一开始不敢说，但后来我还是跟她说了。”
  if (actualContactDetected(t)) return false;

  // Explicit or indirect statements that communication did NOT actually happen.
  // These patterns work regardless of whether “没有” appears at the beginning or end.
  return /^(?:没有|没|还没有|还没|尚未|没有过|没试过|没尝试过)[。！!，,\s]*$/.test(t)
    || /(?:没有|没|还没|尚未|未曾|从来没|从未).{0,12}(?:尝试|试过|沟通|交流|说|提|讲|告诉|表达|聊|谈|开口)/.test(t)
    || /(?:没有|没|还没|尚未|未曾|从来没|从未).{0,12}(?:尝试过|试过)/.test(t)
    || /(?:不敢|没敢|不太敢|不好意思|不方便|不太方便|不知道怎么|不知道如何|不知道该怎么|不知道要怎么|开不了口|没法|无法).{0,10}(?:说|沟通|交流|提|讲|告诉|表达|开口|聊|谈)/.test(t)
    || /(?:不太好|不好|很难|比较难|不容易|没法|无法).{0,6}(?:沟通|交流|开口|说)/.test(t)
    || /(?:沟通|交流).{0,8}(?:没用|没有用|没什么用|也没用|也没有用|不起作用|没意义|没有意义|没必要|解决不了|不会有用)/.test(t)
    || /(?:觉得|感觉|认为).{0,12}(?:不好沟通|不太好沟通|很难沟通|比较难沟通|不好说|不太好说|没法沟通|无法沟通|沟通没用|沟通也没什么用)/.test(t)
    || /(?:没机会|没有机会|找不到机会|一直没机会).{0,8}(?:说|沟通|交流|提|讲|表达|开口)/.test(t)
    || /(?:她|他|对方).{0,6}(?:是)?(?:领导|上级).{0,10}(?:不好说|不方便说|不太方便|不敢说)?/.test(t);
}

const Q2_DETAILS = '可以具体说说你当时是怎么和对方沟通的吗？比如你说了什么。';
const Q3_RESPONSE = '对方当时是怎么回应你的？';
const Q3_HELPFUL = '对方这样的回应有没有帮助你处理当时的情况，还是让事情变得更难处理？';
const Q3_HYPOTHETICAL_RESPONSE = '如果当时和对方沟通，你觉得对方可能会怎么回应？';
const Q3_HYPOTHETICAL_HELPFUL = '你觉得这样的回应会有助于处理这件事，还是会让事情变得更难处理？';
const Q4_DIRECT = '你后来有没有跟当时不在场的人聊过这件事？比如家人、朋友、其他科室同事等。';

// If the participant has already made the impact of the other person's response
// obvious, do not ask a redundant "was that helpful?" question. That can sound
// mechanical or sarcastic (e.g. after "他根本不听，一直在发火").
// Return 'negative', 'positive', or null when the impact is genuinely unclear.
function responseImpactDetected(text) {
  const t = text.trim();

  const negative = /(?:根本不听|完全不听|不听我(?:说|解释)?|听不进去|不接受|不理解|不理|没理|拒绝|反驳|质疑|继续(?:发火|生气|骂|指责|责怪|抱怨|吵)|一直(?:发火|生气|骂|指责|责怪|抱怨|吵)|还是(?:发火|生气|骂|指责|责怪|不听|不同意|不接受|坚持)|仍然(?:发火|生气|骂|指责|责怪|不听|不同意|不接受|坚持)|依然(?:发火|生气|骂|指责|责怪|不听|不同意|不接受|坚持)|态度(?:很差|不好|恶劣)|骂我|冲我发火|训斥|责备|没有帮助|没帮助|更难处理|更麻烦|变得更糟)/.test(t);
  if (negative) return 'negative';

  const positive = /(?:听进去了|听我解释|愿意听|理解了|表示理解|接受了|同意了|答应了|配合了|冷静下来|平静下来|不再(?:发火|指责|骂)|道歉了|跟我道歉|问题解决了|事情解决了|有帮助|帮到了|好处理多了|缓和了)/.test(t);
  if (positive) return 'positive';

  return null;
}

function q3ImpactTransition(impact) {
  if (impact === 'negative') {
    return '听起来对方这样的回应让当时的情况更难处理。' + Q4_DIRECT;
  }
  if (impact === 'positive') {
    return '听起来对方这样的回应对当时处理这件事起到了一些帮助。' + Q4_DIRECT;
  }
  return null;
}
// Q5 uses the participant's own referent for the person they talked to.
// Prefer an explicit gendered pronoun (她/他) when the participant uses one;
// otherwise use the relationship they named (e.g. 同事、朋友、家人) instead of
// mechanically referring to a single person as “他们”.
let q5SupportReferent = '对方';

function explicitSingularPronoun(text) {
  const t = text.trim();
  if (t.includes('她')) return '她';
  // Match singular 他 but not the plural 他们.
  if (/(^|[^他])他(?!们)/.test(t)) return '他';
  return null;
}

function inferSupportReferent(text, fallback = '对方') {
  const t = text.trim();
  const pronoun = explicitSingularPronoun(t);
  if (pronoun) return pronoun;

  if (/(?:同事们|几个同事|几位同事|多位同事|家人和朋友|朋友和家人|好几个人|几个人)/.test(t)) return '他们';
  if (t.includes('护士长')) return '护士长';
  if (t.includes('主管')) return '主管';
  if (t.includes('领导')) return '领导';
  if (t.includes('同事')) return '同事';
  if (t.includes('朋友')) return '朋友';
  if (t.includes('家人')) return '家人';
  if (t.includes('家属')) return '家属';
  return fallback;
}

function updateSupportReferentFromResponse(text) {
  const pronoun = explicitSingularPronoun(text);
  if (pronoun) q5SupportReferent = pronoun;
}

function q5ResponseQuestion() {
  return `${q5SupportReferent}当时是怎么回应你的？`;
}
function q5HelpfulQuestion() {
  return `${q5SupportReferent}这样的回应对你有帮助吗？`;
}
function q5HypotheticalResponseQuestion() {
  const r = q5SupportReferent === '对方' ? '他们' : q5SupportReferent;
  return `如果当时和${r}说起这件事，你觉得${r}可能会怎么回应？`;
}
const Q5_HYPOTHETICAL_HELPFUL = '你觉得这样的回应会对你有帮助吗？';

// Q5 mirrors Q3: once actual social support has been confirmed, keep that state
// across turns so a later reply such as “她说这种事很常见” can never be
// misread as if the participant had not actually talked to anyone.
let q4ActualSupportConfirmed = false;
let q5FollowupMode = null; // 'actual_response', 'actual_help', 'hyp_response', 'hyp_help'

function explicitSupportImpactDetected(text) {
  const t = text.trim();
  if (/(?:很有帮助|有帮助|帮到我|帮了我|让我好受|让我安心|让我放心|缓解了|轻松了一些|感觉好多了)/.test(t)) return 'positive';
  if (/(?:没有帮助|没帮助|没什么帮助|没有太大帮助|没太大帮助|没什么用|反而更难受|更烦|更有压力)/.test(t)) return 'negative';
  return null;
}

function socialSupportResponseDetected(text) {
  const raw = text.trim();

  // First mask phrases where the participant is describing THEIR OWN act of
  // talking to someone, e.g. “跟我一起值班的同事说了”“向朋友提过这件事”.
  // Without this, the substring “同事说了” can be mistaken for the colleague's reply.
  const t = raw.replace(
    /(?:跟|和|向|对|给).{0,18}?(?:同事|朋友|家人|领导|主管|护士长|她|他|他们)(?=(?:聊|说|提|谈|讲|沟通|倾诉|解释|说明|告诉))/g,
    '[倾诉对象]'
  );

  // Clear evidence that the OTHER PERSON actually responded.
  if (/(?:她|他|他们|对方|同事|朋友|家人|领导|主管|护士长).{0,12}(?:安慰|劝|开导|支持|鼓励|理解|表示理解|建议|告诉我|让我|叫我|回复|回应|回答|表示|没说什么|没有说什么|沉默|没回应|没有回应)/.test(t)) {
    return true;
  }

  // Handle “她说…… / 同事说……” only when there is substantive content
  // after “说”. Bare “说了/说过” is not enough to establish what the response was.
  const sayRegex = /(?:她|他|他们|对方|同事|朋友|家人|领导|主管|护士长)说([^，。！？!?]*)/g;
  let m;
  while ((m = sayRegex.exec(t)) !== null) {
    const afterSay = (m[1] || '').trim();
    if (afterSay && !/^(?:了|过|一下|了下)$/.test(afterSay)) return true;
  }

  return false;
}

// Post-scale questions
const POST_SCALE_Q = {
  1: null,
  2: '请选择你在多大程度上同意以下陈述：\n"我现在对这件事有很强烈的情绪，但说不出来这些情绪是什么。"\n1 ○○○○○○○ 完全不同意\n2 ●○○○○○○\n3 ●●○○○○○\n4 ●●●○○○○\n5 ●●●●○○○\n6 ●●●●●○○\n7 ●●●●●●● 非常同意\n请在1-7中选择一个最符合的数字',
  3: '请选择你在多大程度上同意以下陈述：\n"我清楚自己现在对这件事有什么情绪。"\n1 ○○○○○○○ 完全不同意\n2 ●○○○○○○\n3 ●●○○○○○\n4 ●●●○○○○\n5 ●●●●○○○\n6 ●●●●●○○\n7 ●●●●●●● 非常同意\n请在1-7中选择一个最符合的数字',

};

// Core submit: push to history, display, save scale, send to AI
function submitResponse(text) {
  userMsgCount++;
  // Capture response to whichever question was last asked
  if (pendingCapture && !text.startsWith('量表已完成')) {
    textData[pendingCapture] = text;
    pendingCapture = null;
  }

  s.push({ role: 'user', content: text });
  appendMsg('user', text);
  parseAndSaveScale(text);
  if (leasAsked && !leasResponse) {
    leasResponse = text;
    console.log('[LEAS] Response captured:', leasResponse.substring(0, 80));
  }

  // Save snapshot on every user response (overwrites same Lark row)
  saveToLark();

  // Deliver next scale question instantly without API call
  const postScaleStage = CONDITION === 'emotion' ? 4 : 3;

  // Q3 is a two-step sequence. If the participant has just supplied the other
  // person's response, ask helpfulness next. If helpfulness was just answered, move to Q4.
  if (currentStage === 1 && currentQuestion === 3 && q3FollowupMode) {
    let nextQ = null;
    if (q3FollowupMode === 'actual_response') {
      const impact = responseImpactDetected(text);
      if (impact) {
        nextQ = q3ImpactTransition(impact);
        q3FollowupMode = null;
      } else {
        nextQ = Q3_HELPFUL;
        q3FollowupMode = 'actual_help';
      }
    } else if (q3FollowupMode === 'hyp_response') {
      const impact = responseImpactDetected(text);
      if (impact) {
        nextQ = q3ImpactTransition(impact);
        q3FollowupMode = null;
      } else {
        nextQ = Q3_HYPOTHETICAL_HELPFUL;
        q3FollowupMode = 'hyp_help';
      }
    } else if (q3FollowupMode === 'actual_help' || q3FollowupMode === 'hyp_help') {
      q3FollowupMode = null;
      nextQ = Q4_DIRECT;
    }
    if (nextQ) {
      setTimeout(function() {
        s.push({ role: 'assistant', content: nextQ });
        appendMsg('ai', nextQ);
        updateState(nextQ);
      }, 700);
      return;
    }
  }

  // After Q2 (communication with direct party), deliver the appropriate first Q3 step from JS
  if (currentStage === 1 && currentQuestion === 2) {
    console.log('[Q3] currentQ:', currentQuestion, '| text:', text.substring(0,30), '| desc:', descriptionDetected(text));
    // If the user only says “yes” (e.g., “有啊”) without details, do not jump to a
    // hypothetical scenario. Ask them to describe the actual communication first.
    if (bareYesContactDetected(text)) {
      q2ActualCommunicationConfirmed = true;
      setTimeout(function() {
        s.push({ role: 'assistant', content: Q2_DETAILS });
        appendMsg('ai', Q2_DETAILS);
        // Keep currentQuestion at 2 so the next user reply supplies details of the ACTUAL communication.
      }, 700);
      return;
    }

    // If an earlier turn already confirmed that communication happened, never fall back
    // to the hypothetical branch. Interpret this turn as details of that real interaction.
    let q3;
    if (q2ActualCommunicationConfirmed) {
      if (responseFromOtherDetected(text)) {
        const impact = responseImpactDetected(text);
        if (impact) {
          q3 = q3ImpactTransition(impact);
          q3FollowupMode = null;
        } else {
          q3 = Q3_HELPFUL;
          q3FollowupMode = 'actual_help';
        }
      } else {
        q3 = Q3_RESPONSE;
        q3FollowupMode = 'actual_response';
      }
      q2ActualCommunicationConfirmed = false;
    } else if (noContactDetected(text)) {
      q3 = Q3_HYPOTHETICAL_RESPONSE;
      q3FollowupMode = 'hyp_response';
    } else if (actualContactDetected(text) && responseFromOtherDetected(text)) {
      const impact = responseImpactDetected(text);
      if (impact) {
        q3 = q3ImpactTransition(impact);
        q3FollowupMode = null;
      } else {
        q3 = Q3_HELPFUL;
        q3FollowupMode = 'actual_help';
      }
    } else if (actualContactDetected(text)) {
      q3 = Q3_RESPONSE;
      q3FollowupMode = 'actual_response';
    } else {
      q3 = Q3_HYPOTHETICAL_RESPONSE;
      q3FollowupMode = 'hyp_response';
    }
    setTimeout(function() {
      s.push({ role: 'assistant', content: q3 });
      appendMsg('ai', q3);
      updateState(q3);
    }, 700);
    return;
  }

  // After Q4 (social support), establish whether this was an ACTUAL conversation
  // and whether the participant has already described the other person's response.
  if (currentStage === 1 && currentQuestion === 4) {
    let q5;
    // Capture how the participant referred to the person they spoke with so the
    // follow-up can say “同事/朋友/她/他” rather than defaulting to “他们”.
    q5SupportReferent = inferSupportReferent(text, '对方');
    if (noContactDetected(text)) {
      q4ActualSupportConfirmed = false;
      q5FollowupMode = 'hyp_response';
      q5 = q5HypotheticalResponseQuestion();
    } else if (actualContactDetected(text)) {
      q4ActualSupportConfirmed = true;
      if (socialSupportResponseDetected(text)) {
        updateSupportReferentFromResponse(text);
        const impact = explicitSupportImpactDetected(text);
        if (impact) {
          // The participant already stated both the response and whether it helped.
          q5FollowupMode = null;
          q4ActualSupportConfirmed = false;
          q5 = SCALE_Q[7];
        } else {
          q5FollowupMode = 'actual_help';
          q5 = q5HelpfulQuestion();
        }
      } else {
        q5FollowupMode = 'actual_response';
        q5 = q5ResponseQuestion();
      }
    } else {
      // If the answer is vague but indicates some actual sharing (e.g. “和同事聊了一下”),
      // preserve the actual branch rather than inventing a hypothetical one.
      if (/(?:和|跟|向|对).{0,12}(?:同事|朋友|家人|家属|领导|护士长|主管|其他人).{0,8}(?:聊|说|提|谈|讲|沟通|倾诉)/.test(text)
          || /(?:同事|朋友|家人|家属|领导|护士长|主管).{0,8}(?:聊|说|提|谈|讲|沟通|倾诉)/.test(text)) {
        q4ActualSupportConfirmed = true;
        q5FollowupMode = 'actual_response';
        q5 = q5ResponseQuestion();
      } else {
        q4ActualSupportConfirmed = false;
        q5FollowupMode = 'hyp_response';
        q5 = q5HypotheticalResponseQuestion();
      }
    }
    setTimeout(function() {
      s.push({ role: 'assistant', content: q5 });
      appendMsg('ai', q5);
      updateState(q5);
    }, 700);
    return;
  }

  // Q5 is split across turns, just like Q3. Never lose the actual/hypothetical state.
  if (currentStage === 1 && currentQuestion === 5) {
    let nextQ;
    if (q5FollowupMode === 'actual_response') {
      // This turn is the colleague/friend/family member's ACTUAL response.
      // If the participant now says “她说…” or “他说…”, use that pronoun in
      // the helpfulness follow-up; otherwise keep the previously named relationship.
      updateSupportReferentFromResponse(text);
      const impact = explicitSupportImpactDetected(text);
      if (impact) {
        nextQ = SCALE_Q[7];
        q5FollowupMode = null;
        q4ActualSupportConfirmed = false;
        q5SupportReferent = '对方';
      } else {
        nextQ = q5HelpfulQuestion();
        q5FollowupMode = 'actual_help';
      }
    } else if (q5FollowupMode === 'actual_help') {
      nextQ = SCALE_Q[7];
      q5FollowupMode = null;
      q4ActualSupportConfirmed = false;
      q5SupportReferent = '对方';
    } else if (q5FollowupMode === 'hyp_response') {
      nextQ = Q5_HYPOTHETICAL_HELPFUL;
      q5FollowupMode = 'hyp_help';
    } else if (q5FollowupMode === 'hyp_help') {
      nextQ = SCALE_Q[7];
      q5FollowupMode = null;
    } else if (q4ActualSupportConfirmed) {
      // Defensive fallback: actual support was previously confirmed, so never ask a
      // hypothetical question even if the follow-up mode was somehow lost.
      nextQ = q5HelpfulQuestion();
      q5FollowupMode = 'actual_help';
    } else {
      nextQ = SCALE_Q[7];
    }

    setTimeout(function() {
      s.push({ role: 'assistant', content: nextQ });
      appendMsg('ai', nextQ);
      updateState(nextQ);
    }, 800);
    return;
  }

  if (currentStage === 1 && currentQuestion >= 7 && currentQuestion < 11) {
    const nextQ = SCALE_Q[currentQuestion + 1];  // Q8-Q11 from SCALE_Q
    if (nextQ) {
      setTimeout(function() {
        s.push({ role: 'assistant', content: nextQ });
        appendMsg('ai', nextQ);
        updateState(nextQ);
      }, 600);
      return;
    }
  }
  if (currentStage === postScaleStage && currentQuestion >= 1 && currentQuestion < 5) {
    const nextQ = POST_SCALE_Q[currentQuestion + 1];
    if (nextQ) {
      setTimeout(function() {
        s.push({ role: 'assistant', content: nextQ });
        appendMsg('ai', nextQ);
        updateState(nextQ);
      }, 600);
      return;
    }
  }

  // Save after every user response (overwrite mode)
  saveToLark();

  sendToAI(s);
}

function handleSend() {
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = '42px';
  submitResponse(text);
}

// Returns true if the AI message contains a 1-7 scale
function isScaleMessage(text) {
  return text.includes('1 ○○○○○○○');
}

// Strip scale lines from display text, extract anchor labels
function parseScaleMessage(text) {
  const lines = text.split('\n');
  const leftLine  = lines.find(l => /^1 ○/.test(l));
  const rightLine = lines.find(l => /^7 ●/.test(l));
  const leftLabel  = leftLine  ? leftLine.replace(/^1 [○● ]+/, '').trim() : '';
  const rightLabel = rightLine ? rightLine.replace(/^7 [○● ]+/, '').trim() : '';
  const cleanLines = lines.filter(l =>
    !/^[1-7] [○● ]/.test(l) &&
    !/^请在1-7中选择/.test(l)
  );
  return { cleanText: cleanLines.join('\n').trim(), leftLabel, rightLabel };
}

// Build and attach interactive 1-7 scale widget to a bubble element
function renderScaleWidget(bubble, leftLabel, rightLabel) {
  const widget = document.createElement('div');
  widget.className = 'scale-widget';
  const hintDiv = document.createElement('div');
  hintDiv.className = 'scale-hint';
  hintDiv.textContent = '点击数字选择';
  const labelsDiv = document.createElement('div');
  labelsDiv.className = 'scale-labels';
  const lSpan = document.createElement('span'); lSpan.textContent = leftLabel;
  const rSpan = document.createElement('span'); rSpan.textContent = rightLabel;
  labelsDiv.appendChild(lSpan);
  labelsDiv.appendChild(rSpan);
  const optsDiv = document.createElement('div');
  optsDiv.className = 'scale-options';
  for (let i = 1; i <= 7; i++) {
    const btn = document.createElement('button');
    btn.className = 'scale-opt';
    btn.textContent = i;
    btn.addEventListener('click', (function(val, b) {
      return function() {
        optsDiv.querySelectorAll('.scale-opt').forEach(x => { x.disabled = true; x.classList.remove('selected'); });
        b.classList.add('selected');
        console.log('[Scale] Selected:', val, '| stage:', currentStage, '| Q:', currentQuestion);
        submitResponse(String(val));
      };
    })(i, btn));
    optsDiv.appendChild(btn);
  }
  widget.appendChild(hintDiv);
  widget.appendChild(labelsDiv);
  widget.appendChild(optsDiv);
  bubble.appendChild(widget);
}

document.getElementById('chatSubmit').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  // DEBUG shortcut: Shift+M triggers pre-matrix, Shift+N triggers post-matrix
  if (e.shiftKey && e.key === 'M') { e.preventDefault(); console.log('[Debug] Manual pre-matrix trigger'); startPreMatrices(); }
  if (e.shiftKey && e.key === 'N') { e.preventDefault(); console.log('[Debug] Manual post-matrix trigger'); startPostMatrices(); }
});
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = '42px';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Init: read participant ID from URL, start chat immediately ───────────────
// participantId is already set from URL param at top of script
// Replace PARTICIPANT_ID placeholder in system prompts
s[0].content = s[0].content.replace(/PARTICIPANT_ID/g, participantId);
s[1].content = s[1].content.replace(/PARTICIPANT_ID/g, participantId);

console.log('[Study] participant_id:', participantId, '| condition:', CONDITION);
appendMsg('ai', OPENING_MESSAGE);

// Send a final duration save when the window is closed or navigated away
window.addEventListener('pagehide', function() {
  if (!larkRowNumber) return;  // no row created yet, nothing to update
  const finalPayload = JSON.stringify({
    participant_id: participantId,
    condition: CONDITION,
    duration: Math.round((new Date() - startTime) / 1000),
    row_number: larkRowNumber,
  });
  navigator.sendBeacon(PROXY_URL + '/save-update', new Blob([finalPayload], { type: 'application/json' }));
});
